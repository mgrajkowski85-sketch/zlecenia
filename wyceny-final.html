<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Wyceny Montażu</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#0f172a;color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
h1{margin:0;font-size:24px}.sub{margin:5px 0 0;color:#cbd5e1;font-size:14px}
main{max-width:1100px;margin:auto;padding:14px}
.panel{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px #0000000d}
input,button,select{font:inherit}input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.search{margin-bottom:12px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:4px}
.chip{border:0;background:#e2e8f0;padding:9px 12px;border-radius:999px;white-space:nowrap}.chip.active{background:#0f172a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.card{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;transition:.15s}
.card:active{transform:scale(.98)}.card img{width:100%;height:105px;object-fit:cover;display:block}.card .ct{padding:10px}
.cat{font-size:11px;color:#64748b}.name{font-weight:700;font-size:14px;line-height:1.2;margin-top:3px}
.note{font-size:12px;color:#64748b;margin-top:3px}.empty{padding:20px;text-align:center;color:#64748b}
.quote-row{display:grid;grid-template-columns:1fr 70px 100px 34px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #e2e8f0}
.quote-name{font-weight:650;font-size:14px}.small{font-size:11px;color:#64748b}
.qty,.price{padding:9px 7px!important;text-align:right}
.del{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;height:38px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:12px 15px;background:#0f172a;color:#fff;font-weight:700}.btn.alt{background:#e2e8f0;color:#0f172a}.btn.green{background:#166534}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}
.hidden{display:none!important}
@media(max-width:560px){.quote-row{grid-template-columns:1fr 62px 90px 34px}.grid{grid-template-columns:repeat(2,1fr)}}
@media print{header,.picker,.actions,.no-print{display:none!important}body{background:#fff}.panel{box-shadow:none;border:0}}
</style>
</head>
<body>
<header><h1>Wyceny Montażu</h1><p class="sub">Wybierz sprzęt lub usługę — ceny pojawią się dopiero w wycenie</p></header>
<main>
<section class="panel picker">
<input id="search" class="search" type="text" placeholder="Szukaj: kamera, switch, MikroTik, antena...">
<div id="chips" class="chips"></div>
<div id="cards" class="grid" style="margin-top:12px"></div>
</section>

<section class="panel">
<h2 style="margin:0 0 10px">Wycena</h2>
<div style="display:grid;gap:8px;margin-bottom:12px">
<input id="client" type="text" placeholder="Klient">
<input id="address" type="text" placeholder="Adres montażu">
</div>
<div id="quote"></div>
<div class="total"><span>Razem</span><span id="sum">0,00 zł</span></div>
<div class="actions">
<button class="btn green" onclick="printQuote()">PDF / drukuj</button>
<button class="btn alt" onclick="clearQuote()">Wyczyść wycenę</button>
</div>
</section>

<section class="panel">
<details><summary><b>Cennik</b> — edytuj ceny sprzętu i usług</summary>
<div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Pozycja</th><th>Kategoria</th><th>Cena</th></tr></thead><tbody id="prices"></tbody></table></div>
</details>
</section>
</main>
<script>
const IMG={
Monitoring:'https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=900&q=85',
Sieć:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=900&q=85',
MikroTik:'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=900&q=85',
Ubiquiti:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=85',
Anteny:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=85',
Okablowanie:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=900&q=85',
Materiały:'https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=900&q=85',
Rack:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=900&q=85',
Usługi:'https://images.unsplash.com/photo-1581092921461-eab62e97a780?auto=format&fit=crop&w=900&q=85'
};
const catalog=[
['Monitoring','Kamera IP Dahua',450],['Monitoring','Kamera IP Hikvision',450],['Monitoring','Kamera HDCVI Dahua',380],['Monitoring','Kamera Turbo HD Hikvision',380],['Monitoring','Kamera PTZ',950],['Monitoring','Kamera Wi‑Fi',300],['Monitoring','Kamera 4G/LTE',550],['Monitoring','Rejestrator NVR',650],['Monitoring','Rejestrator XVR',550],['Monitoring','Dysk do monitoringu 2TB',420],
['Sieć','Switch PoE 4 porty',280],['Sieć','Switch PoE 8 portów',420],['Sieć','Switch PoE 16 portów',750],['Sieć','Switch PoE 24 porty',1050],['Sieć','Switch Gigabit',180],['Sieć','Switch SFP',450],
['MikroTik','MikroTik hEX',280],['MikroTik','MikroTik hEX S',380],['MikroTik','MikroTik RB',650],['MikroTik','MikroTik CRS',750],['MikroTik','MikroTik SXT',450],['MikroTik','MikroTik LHG',520],['MikroTik','MikroTik wAP',350],['MikroTik','MikroTik cAP',420],
['Ubiquiti','UniFi AP',520],['Ubiquiti','UniFi Switch',850],['Ubiquiti','NanoStation',550],['Ubiquiti','LiteBeam',520],
['Anteny','Antena Wi‑Fi kierunkowa',250],['Anteny','Antena LTE/5G',320],['Anteny','Antena DVB-T',150],['Anteny','Maszt antenowy',220],['Anteny','Uchwyt antenowy',70],
['Okablowanie','UTP Cat.5e — 1 m',2.5],['Okablowanie','UTP Cat.6 — 1 m',3],['Okablowanie','FTP Cat.6 — 1 m',4],['Okablowanie','Przewód koncentryczny — 1 m',3],['Okablowanie','Patchcord',15],
['Materiały','Wtyk RJ45',2],['Materiały','Keystone RJ45',12],['Materiały','Gniazdo RJ45',20],['Materiały','Zasilacz 12V',35],['Materiały','Injector PoE',45],['Materiały','Zasilacz PoE',75],
['Rack','Szafa rack',900],['Rack','Patch panel',180],['Rack','Półka rack',120],['Rack','Organizer kabli',55],
['Usługi','Montaż kamery',150],['Usługi','Montaż switcha',120],['Usługi','Montaż anteny',180],['Usługi','Montaż routera',120],['Usługi','Konfiguracja MikroTik',250],['Usługi','Konfiguracja UniFi',220],['Usługi','Konfiguracja NVR',180],['Usługi','Konfiguracja kamer',250],['Usługi','Konfiguracja sieci',300],['Usługi','Zarobienie RJ45',15],['Usługi','Test okablowania',50],['Usługi','Dojazd',50],['Usługi','Pomiar instalacji',100],['Usługi','Materiał instalacyjny',50]
];
let prices=JSON.parse(localStorage.getItem('wyceny-standalone-prices')||'null')||Object.fromEntries(catalog.map(x=>[x[1],x[2]]));
let quote=JSON.parse(localStorage.getItem('wyceny-standalone-quote')||'[]');
let cat='Wszystko';
const cats=['Wszystko',...new Set(catalog.map(x=>x[0]))];
function money(v){return Number(v||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł'}
function save(){localStorage.setItem('wyceny-standalone-prices',JSON.stringify(prices));localStorage.setItem('wyceny-standalone-quote',JSON.stringify(quote))}
function render(){
 document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip '+(c===cat?'active':'')+'" onclick="cat='+JSON.stringify(c)+';render()">'+c+'</button>').join('');
 const q=document.getElementById('search').value.toLowerCase();
 const list=catalog.filter(x=>(cat==='Wszystko'||x[0]===cat)&&x[1].toLowerCase().includes(q));
 document.getElementById('cards').innerHTML=list.length?list.map((x,i)=>'<div class="card" onclick="add('+catalog.indexOf(x)+')"><img src="'+IMG[x[0]]+'" loading="lazy"><div class="ct"><div class="cat">'+x[0]+'</div><div class="name">'+x[1]+'</div><div class="note">Kliknij, aby dodać</div></div></div>').join(''):'<div class="empty">Brak wyników</div>';
 document.getElementById('quote').innerHTML=quote.length?quote.map((x,i)=>'<div class="quote-row"><div><div class="quote-name">'+esc(x.name)+'</div><div class="small">'+esc(x.cat)+'</div></div><input class="qty" type="number" min="1" value="'+x.qty+'" onchange="changeQty('+i+',this.value)"><input class="price" type="number" min="0" step="0.01" value="'+x.price+'" onchange="changePrice('+i+',this.value)"><button class="del" onclick="removeQ('+i+')">×</button></div>').join(''):'<div class="empty">Nie dodano jeszcze żadnej pozycji.</div>';
 document.getElementById('sum').textContent=money(quote.reduce((s,x)=>s+x.qty*x.price,0));
 document.getElementById('prices').innerHTML=catalog.map(x=>'<tr><td>'+esc(x[1])+'</td><td>'+x[0]+'</td><td><input style="width:110px" type="number" min="0" step="0.01" value="'+(prices[x[1]]??0)+'" onchange="setPrice('+JSON.stringify(x[1])+',this.value)"></td></tr>').join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function add(i){const x=catalog[i], found=quote.find(q=>q.name===x[1]); if(found)found.qty++; else quote.push({name:x[1],cat:x[0],qty:1,price:Number(prices[x[1]]||0)});save();render()}
function removeQ(i){quote.splice(i,1);save();render()}
function changeQty(i,v){quote[i].qty=Math.max(1,Number(v)||1);save();render()}
function changePrice(i,v){quote[i].price=Math.max(0,Number(v)||0);save();render()}
function setPrice(n,v){prices[n]=Math.max(0,Number(v)||0);save();const q=quote.find(x=>x.name===n);if(q)q.price=prices[n];render()}
function clearQuote(){if(confirm('Wyczyścić wycenę?')){quote=[];save();render()}}
function printQuote(){
 const client=esc(document.getElementById('client').value||'—'), address=esc(document.getElementById('address').value||'—');
 const rows=quote.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td></tr>').join('');
 const total=money(quote.reduce((s,x)=>s+x.qty*x.price,0));
 const w=window.open('','_blank'); if(!w){alert('Zezwól przeglądarce na otwieranie okien.');return}
 w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Wycena</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111}h1{margin-bottom:4px}p{margin:4px 0}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border:1px solid #bbb;padding:8px;text-align:left}th{background:#eee}.total{text-align:right;font-size:22px;font-weight:bold;margin-top:18px}@media print{button{display:none}}</style></head><body><h1>Wycena montażu</h1><p>Klient: '+client+'</p><p>Adres: '+address+'</p><table><tr><th>Lp.</th><th>Pozycja</th><th>Ilość</th><th>Cena</th><th>Wartość</th></tr>'+rows+'</table><div class="total">Razem: '+total+'</div><p style="margin-top:35px">Wygenerowano: '+new Date().toLocaleString('pl-PL')+'</p><button onclick="window.print()">Zapisz / drukuj PDF</button></body></html>');
 w.document.close(); w.focus();
}
document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
