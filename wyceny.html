<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Wyceny Montażu — offline</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;background:#eef2f7}
*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10;box-shadow:0 5px 20px #0003}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;color:#cbd5e1;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.form{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px #0f172a12}.stat{font-size:26px;font-weight:850}.muted{color:#64748b;font-size:13px}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#0f172a;color:#fff;width:100%}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin:6px 0 10px}.item{display:flex;gap:7px;align-items:center}.item .input{margin:5px 0}.qty{width:70px}.price{width:105px}.total{text-align:right;font-size:23px;font-weight:850;padding:13px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbe2ea;padding:8px;display:flex;z-index:20}.nav button{flex:1;background:none;border:0;font-weight:700;color:#475569}.empty{text-align:center;padding:40px;color:#64748b}
.pick-title{font-weight:850;margin:5px 0 10px}.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.pick{border:1px solid #dbe3ee;background:#f8fafc;border-radius:16px;padding:10px;text-align:left;cursor:pointer;transition:.15s}.pick:active{transform:scale(.98)}.pic{height:86px;border-radius:12px;background:linear-gradient(135deg,#e0f2fe,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:7px}.pick b{display:block;font-size:14px}.pick span{display:block;color:#64748b;font-size:12px;margin-top:2px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:800;margin-bottom:7px}
@media(min-width:620px){.picker{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><h1>Wyceny Montażu</h1><p>Wersja offline — PDF działa bez internetu</p></header>
<div id="app"></div>
<script>
const KEY="wyceny-offline-v2";
let db=JSON.parse(localStorage.getItem(KEY)||'{"quotes":[],"services":[]}');
if(!db.services.length) db.services=[
{name:"Montaż kamery",price:150,icon:"📷",cat:"Monitoring"},
{name:"Switch sieciowy",price:120,icon:"🔀",cat:"Sieć"},
{name:"Antena Wi‑Fi",price:180,icon:"📡",cat:"Sieć"},
{name:"Antena DVB‑T",price:150,icon:"📺",cat:"Anteny"},
{name:"Montaż rejestratora",price:200,icon:"🎥",cat:"Monitoring"},
{name:"Montaż alarmu",price:300,icon:"🚨",cat:"Alarm"},
{name:"Montaż zamka / wkładki",price:100,icon:"🔐",cat:"Zabezpieczenia"},
{name:"Konfiguracja sieci",price:150,icon:"🌐",cat:"Sieć"},
{name:"Materiał instalacyjny",price:50,icon:"🧰",cat:"Materiał"},
{name:"Przewód / okablowanie",price:5,icon:"🔌",cat:"Materiał"},
{name:"Dojazd",price:50,icon:"🚗",cat:"Dojazd"},
{name:"Montaż urządzenia",price:100,icon:"🛠️",cat:"Montaż"}];
let view="home",draft=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return Number(n||0).toFixed(2).replace(".",",")+" zł"}
function esc(s){return String(s||"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function go(v){view=v;render()}
function newQuote(){draft={client:"",date:new Date().toISOString().slice(0,10),items:[],note:""};view="new";render()}
function nav(){return '<nav class="nav"><button onclick="go(\'home\')">🏠 Start</button><button onclick="newQuote()">➕ Wycena</button><button onclick="go(\'quotes\')">📋 Wyceny</button><button onclick="go(\'services\')">💰 Cennik</button></nav>'}
function render(){let body=view==="home"?home():view==="new"?editor():view==="quotes"?quotes():services();document.getElementById("app").innerHTML='<main class="wrap">'+body+'</main>'+nav()}
function home(){let sum=db.quotes.reduce((a,q)=>a+q.total,0);return '<div class="grid"><div class="card"><div class="muted">Liczba wycen</div><div class="stat">'+db.quotes.length+'</div></div><div class="card"><div class="muted">Wartość</div><div class="stat">'+money(sum)+'</div></div></div><button class="btn primary" onclick="newQuote()">➕ Nowa wycena</button><div class="card" style="margin-top:12px"><b>📱 Wyceny offline</b><p class="muted">Dodajesz urządzenia ze zdjęciowych kafelków, a PDF zapisuje się bez internetu.</p></div>'}
function picker(){return '<div class="pick-title">Wybierz co montujesz</div><div class="picker">'+db.services.map((s,i)=>'<button class="pick" onclick="addService('+i+')"><div class="pic">'+(s.icon||"🧰")+'</div><span class="tag">'+esc(s.cat||"Usługa")+'</span><b>'+esc(s.name)+'</b><span>'+money(s.price)+'</span></button>').join("")+'</div>'}
function editor(){let rows=draft.items.map((x,i)=>'<div class="item"><input class="input" placeholder="Usługa / materiał" value="'+esc(x.name)+'" oninput="draft.items['+i+'].name=this.value"><input class="input qty" type="number" min="1" value="'+x.qty+'" oninput="draft.items['+i+'].qty=+this.value;refreshTotal()"><input class="input price" type="number" min="0" value="'+x.price+'" oninput="draft.items['+i+'].price=+this.value;refreshTotal()"><button class="btn danger" onclick="draft.items.splice('+i+',1);render()">×</button></div>').join("");let total=draft.items.reduce((a,x)=>a+x.qty*x.price,0);return '<button class="btn secondary" onclick="go(\'home\')">← Wróć</button><div class="form"><b>Klient</b><input class="input" placeholder="Imię i nazwisko / firma" value="'+esc(draft.client)+'" oninput="draft.client=this.value"><b>Data</b><input class="input" type="date" value="'+draft.date+'" oninput="draft.date=this.value">'+picker()+'<b>Pozycje wyceny</b>'+rows+'<button class="btn secondary" onclick="addItem()">＋ Dodaj własną pozycję</button><div id="total" class="total">Razem: '+money(total)+'</div><textarea class="input" rows="3" placeholder="Uwagi" oninput="draft.note=this.value">'+esc(draft.note)+'</textarea><button class="btn primary" onclick="saveQuote()">💾 Zapisz wycenę</button></div>'}
function addService(i){let s=db.services[i];let found=draft.items.find(x=>x.name===s.name&&x.price===s.price);if(found)found.qty++;else draft.items.push({name:s.name,qty:1,price:s.price});render()}
function addItem(){draft.items.push({name:"",qty:1,price:0});render()}
function refreshTotal(){let t=draft.items.reduce((a,x)=>a+x.qty*x.price,0),e=document.getElementById("total");if(e)e.textContent="Razem: "+money(t)}
function saveQuote(){if(!draft.client.trim()){alert("Wpisz klienta.");return}draft.total=draft.items.reduce((a,x)=>a+x.qty*x.price,0);draft.id=Date.now();db.quotes.unshift({...draft});save();view="quotes";render()}
function quotes(){if(!db.quotes.length)return '<div class="empty">Brak wycen.<br><br><button class="btn primary" onclick="newQuote()">Utwórz pierwszą</button></div>';return '<button class="btn primary" onclick="newQuote()">➕ Nowa wycena</button>'+db.quotes.map(q=>'<div class="card"><b>'+esc(q.client)+'</b><div class="muted">'+q.date+' · '+q.items.length+' pozycji</div><div class="total">'+money(q.total)+'</div><button class="btn primary" onclick="pobierzPdfWyceny('+q.id+')">📄 PDF</button><br><br><button class="btn secondary" onclick="shareQuote('+q.id+')">📤 Udostępnij</button> <button class="btn danger" onclick="delQuote('+q.id+')">Usuń</button></div>').join("")}
function delQuote(id){db.quotes=db.quotes.filter(q=>q.id!==id);save();render()}
function shareQuote(id){let q=db.quotes.find(x=>x.id===id),text="WYCENA\\nKlient: "+q.client+"\\nData: "+q.date+"\\n\\n"+q.items.map(x=>x.name+" × "+x.qty+" = "+money(x.qty*x.price)).join("\\n")+"\\n\\nRAZEM: "+money(q.total)+(q.note?"\\nUwagi: "+q.note:"");if(navigator.share)navigator.share({title:"Wycena",text});else navigator.clipboard.writeText(text).then(()=>alert("Wycena skopiowana."))}
function services(){return '<div class="card"><b>💰 Cennik i kafelki</b><p class="muted">Możesz zmienić nazwę, cenę i ikonę urządzenia.</p>'+db.services.map((s,i)=>'<div class="item"><input class="input" value="'+esc(s.icon||"🧰")+'" style="width:58px;text-align:center" oninput="db.services['+i+'].icon=this.value;save()"><input class="input" value="'+esc(s.name)+'" oninput="db.services['+i+'].name=this.value;save()"><input class="input price" type="number" value="'+s.price+'" oninput="db.services['+i+'].price=+this.value;save()"></div>').join("")+'<button class="btn secondary" onclick="db.services.push({name:\'Nowa usługa\',price:0,icon:\'🧰\',cat:\'Inne\'});save();render()">＋ Dodaj usługę</button></div>'}
render();
</script>
<script>
function winAnsi(s){const m={"Ą":"\xA5","ą":"\xB9","Ć":"\xC6","ć":"\xE6","Ę":"\xCA","ę":"\xEA","Ł":"\xA3","ł":"\xB3","Ń":"\xD1","ń":"\xF1","Ó":"\xD3","ó":"\xF3","Ś":"\x8C","ś":"\x9C","Ź":"\x8F","ź":"\x9F","Ż":"\xAF","ż":"\xBF","€":"\x80"};return [...String(s||"")].map(c=>m[c]||c).join("")}
function pe(s){return winAnsi(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function makePDF(q){let lines=["WYCENA","Nr: WYC-"+q.id,"Data: "+q.date,"Klient: "+q.client,"","Usługa / materiał    Ilość   Cena       Wartość"];q.items.forEach((x,i)=>lines.push((i+1)+". "+x.name+" | "+x.qty+" | "+Number(x.price).toFixed(2)+" zł | "+Number(x.qty*x.price).toFixed(2)+" zł"));lines.push("","RAZEM: "+Number(q.total).toFixed(2)+" zł");if(q.note)lines.push("Uwagi: "+q.note);let pages=[];for(let i=0;i<lines.length;i+=45)pages.push(lines.slice(i,i+45));let objs=[];function add(s){objs.push(s);return objs.length}let pagesId=add("");let fontId=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");let pageIds=[];pages.forEach(pg=>{let content="BT\\n/F1 18 Tf\\n50 800 Td\\n("+pe(pg[0])+") Tj\\n/F1 10 Tf\\n0 -24 Td\\n";for(let i=1;i<pg.length;i++){content+="("+pe(pg[i].slice(0,95))+") Tj\\n0 -16 Td\\n"}content+="ET";let cid=add("<< /Length "+content.length+" >>\\nstream\\n"+content+"\\nendstream");let pid=add("<< /Type /Page /Parent "+pagesId+" 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 "+fontId+" 0 R >> >> /Contents "+cid+" 0 R >>");pageIds.push(pid)});objs[pagesId-1]="<< /Type /Pages /Kids ["+pageIds.map(x=>x+" 0 R").join(" ")+"] /Count "+pageIds.length+" >>";let catalogId=add("<< /Type /Catalog /Pages "+pagesId+" 0 R >>");let pdf="%PDF-1.4\\n",offs=[0];for(let i=0;i<objs.length;i++){offs.push(pdf.length);pdf+=(i+1)+" 0 obj\\n"+objs[i]+"\\nendobj\\n"}let xref=pdf.length;pdf+="xref\\n0 "+(objs.length+1)+"\\n0000000000 65535 f \\n";for(let i=1;i<=objs.length;i++)pdf+=String(offs[i]).padStart(10,"0")+" 00000 n \\n";pdf+="trailer\\n<< /Size "+(objs.length+1)+" /Root "+catalogId+" 0 R >>\\nstartxref\\n"+xref+"\\n%%EOF";return pdf}
function pobierzPdfWyceny(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;let bin=makePDF(q),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let blob=new Blob([bytes],{type:"application/pdf"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wycena-"+q.date+".pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script>
</body></html>
