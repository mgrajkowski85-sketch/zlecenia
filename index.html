function wierszWpisu(z){
  var meta = '<span class="plakietka p-' + z.status + '">' + STATUSY[z.status].nazwa + "</span>";
  var czas = z.czas ? czasTekst(z.czas) : "";
  var km   = z.km   ? kmTekst(z.km)     : "";
  if(z.od && z.do) meta += '<span class="meta-tekst">' + esc(z.od + "–" + z.do) + "</span>";
  if(czas) meta += '<span class="meta-tekst">' + esc(czas) + "</span>";
  if(km)   meta += '<span class="meta-tekst">' + esc(km) + "</span>";
  if(z.nastepnym) meta += '<span class="znacznik">↻ na następny raz</span>';
  var przyp = przypDlaZlecenia(z.id);
  if(przyp && przyp.data){
    var minelo = przyp.data < dzisiaj();
    meta += '<span class="znacznik dzwonek' + (minelo ? " minelo" : "") + '">🔔 ' +
            esc(dataKrotka(przyp.data)) + (przyp.godzina ? " " + esc(przyp.godzina) : "") +
            "</span>";
  }
  return '<button class="wpis" data-otworz="' + z.id + '">' +
    '<span class="pasek-statusu s-' + z.status + '"></span>' +
    '<span class="wpis-tresc">' +
      '<span class="wpis-klient">' + esc(z.klient || "(bez klienta)") + "</span>" +
      (z.opis ? '<span class="wpis-opis">' + esc(z.opis) + "</span>" : "") +
      '<span class="wpis-meta">' + meta + "</span></span></button>";
}

/* ============ widok: Czas pracy (tygodniami) ============ */
/* Tydzien liczymy od poniedzialku do niedzieli — tak jak kalendarz w apce. */
function poniedzialekDla(k){
  var d = zKlucza(k);
  d.setDate(d.getDate() - dowPon(d));
  return naKlucz(d);
}
function oDni(k, ile){
  var d = zKlucza(k);
  d.setDate(d.getDate() + ile);
  return naKlucz(d);
}
/* Tygodnie, ktore zahaczaja o wybrany miesiac. Bierzemy CALE tygodnie, razem z
   dniami z sasiedniego miesiaca — inaczej "laczny czas w tygodniu" bylby uciety
   w poprzek roboty z przelomu miesiaca. */
function tygodnieMiesiaca(m){
  var ostatni = new Date(m.r, m.m + 1, 0).getDate();
  var k = poniedzialekDla(m.r + "-" + pad(m.m + 1) + "-01");
  var koniec = poniedzialekDla(m.r + "-" + pad(m.m + 1) + "-" + pad(ostatni));
  var lista = [];
  while(k <= koniec){ lista.push(k); k = oDni(k, 7); }
  return lista;
}
/* Godziny, kilometry i zlecenia jednego tygodnia, z rozbiciem na dni. */
function czasTygodnia(pon){
  var koniec = oDni(pon, 6);
  var w = { od:pon, do:koniec, ile:0, godz:0, km:0, bezCzasu:0, dni:[], zlecenia:[] };
  for(var i = 0; i < 7; i++) w.dni.push({ data:oDni(pon, i), ile:0, godz:0 });
  wszystkie().forEach(function(z){
    var d = String(z.data || "");
    if(d < pon || d > koniec) return;
    var g  = parseFloat(String(z.czas || "").replace(",", "."));
    var km = parseFloat(String(z.km   || "").replace(",", "."));
    w.ile++;
    w.zlecenia.push(z);
    if(isNaN(g)) w.bezCzasu++; else w.godz += g;
    if(!isNaN(km)) w.km += km;
    var dzien = w.dni[dowPon(zKlucza(d))];
    if(dzien){ dzien.ile++; if(!isNaN(g)) dzien.godz += g; }
  });
  w.zlecenia.sort(function(a, b){
    if(a.data !== b.data) return a.data.localeCompare(b.data);
    return STATUSY[a.status].kolejnosc - STATUSY[b.status].kolejnosc;
  });
  return w;
}
function zakresTygodnia(od, doKiedy){
  var a = zKlucza(od), b = zKlucza(doKiedy);
  if(a.getMonth() === b.getMonth())
    return a.getDate() + "–" + b.getDate() + " " + MIESIACE_D[b.getMonth()];
  return a.getDate() + " " + MIESIACE_D[a.getMonth()] + " – " +
         b.getDate() + " " + MIESIACE_D[b.getMonth()];
}

function widokCzas(){
  var m = stan.miesiac;
  var dzis = dzisiaj();
  var przedrostek = m.r + "-" + pad(m.m + 1);
  var tygodnie = tygodnieMiesiaca(m).map(czasTygodnia);
  var najwiecej = tygodnie.reduce(function(n, t){ return Math.max(n, t.godz); }, 0);
  var razem = tygodnie.reduce(function(w, t){
    w.ile += t.ile; w.godz += t.godz; w.km += t.km; w.bezCzasu += t.bezCzasu;
    return w;
  }, { ile:0, godz:0, km:0, bezCzasu:0 });
  var zRobota = tygodnie.filter(function(t){ return t.godz > 0; }).length;
  var wMiesiacu = podsumowanieMiesiaca(m);

  var naglowek = '<div class="miesiac">' +
    '<button class="strzalka" data-miesiac="-1" aria-label="Poprzedni miesiąc">‹</button>' +
    "<b>" + MIESIACE[m.m] + " " + m.r + "</b>" +
    '<button class="strzalka" data-miesiac="1" aria-label="Następny miesiąc">›</button></div>';

  if(!razem.ile){
    return naglowek + '<div class="pusto"><div class="duze">Pusty miesiąc</div>' +
      "<p>W tygodniach tego miesiąca nie ma jeszcze żadnego zlecenia. Godziny " +
      "biorą się z pola <b>Czas</b> przy zleceniu — albo ze stopera.</p></div>";
  }

  var karty = tygodnie.map(function(t){
    var otwarty = stan.czasTydzien === t.od;
    var biezacy = dzis >= t.od && dzis <= t.do;
    var szerokosc = najwiecej ? Math.round(t.godz / najwiecej * 100) : 0;

    var dni = t.dni.map(function(d, i){
      var poza = d.data.slice(0, 7) !== przedrostek;
      return '<span class="cz-dzien' + (poza ? " poza" : "") +
        (d.data === dzis ? " dzis" : "") + '">' +
        '<span class="cz-dow">' + DNI_SKROT[i] + "</span>" +
        '<span class="cz-ile">' + (d.godz ? liczba(d.godz) : (d.ile ? "?" : "·")) +
        "</span></span>";
    }).join("");

    var drobne = t.ile + " " + odmiana(t.ile, "zlecenie", "zlecenia", "zleceń") +
      (t.km ? " · " + liczba(t.km) + " km" : "") +
      (t.bezCzasu ? " · " + t.bezCzasu + " bez godzin" : "");

    var gora = '<button class="cz-gora" data-tydzien="' + t.od + '" aria-expanded="' +
      (otwarty ? "true" : "false") + '">' +
      '<span class="cz-naglowek"><span class="cz-strzal">▶</span>' +
        '<span class="cz-zakres">' + zakresTygodnia(t.od, t.do) + "</span>" +
        (biezacy ? '<span class="cz-teraz">ten tydzień</span>' : "") +
        '<span class="cz-godziny">' + liczba(t.godz) + " h</span></span>" +
      '<span class="cz-drobne">' + drobne + "</span>" +
      '<span class="cz-pasek">' + (t.godz ? '<i style="width:' + szerokosc + '%"></i>' : "") +
        "</span>" +
      '<span class="cz-dni">' + dni + "</span></button>";

    var szczegoly = "";
    if(otwarty){
      var out = "", ostatnia = "";
      t.zlecenia.forEach(function(z){
        if(z.data !== ostatnia){
          if(ostatnia) out += "</div>";
          out += '<div class="grupa-data">' + dataDluga(z.data) + '</div><div class="lista">';
          ostatnia = z.data;
        }
        out += wierszWpisu(z);
      });
      if(ostatnia) out += "</div>";
      szczegoly = '<div class="cz-szczegoly">' +
        (out || '<div class="firmy-pusto">W tym tygodniu nic nie zapisane.</div>') + "</div>";
    }

    return '<div class="cz-tydzien' + (biezacy ? " biezacy" : "") + '"' +
      (otwarty ? ' data-otwarte="1"' : "") + ">" + gora + szczegoly + "</div>";
  }).join("");

  var stopka = '<div class="cz-suma">' +
    '<div class="cz-suma-wiersz"><span>Razem w tych tygodniach</span><b>' +
      liczba(razem.godz) + " h</b></div>" +
    '<div class="cz-suma-wiersz drobny"><span>Średnio na tydzień z robotą</span><b>' +
      liczba(zRobota ? razem.godz / zRobota : 0) + " h</b></div>" +
    '<div class="cz-suma-wiersz drobny"><span>Sam ' + MIESIACE[m.m] +
      ", bez dni z sąsiednich miesięcy</span><b>" + liczba(wMiesiacu.godz) + " h</b></div>" +
    (razem.km
      ? '<div class="cz-suma-wiersz drobny"><span>Trasa w tych tygodniach</span><b>' +
        liczba(razem.km) + " km</b></div>"
      : "") +
    "</div>";

  var uwaga = razem.bezCzasu
    ? '<div class="cz-uwaga">' + razem.bezCzasu + " " +
      odmiana(razem.bezCzasu, "zlecenie nie ma", "zlecenia nie mają", "zleceń nie ma") +
      " wpisanych godzin — o tyle te tygodnie mogą być zaniżone.</div>"
    : "";

  return naglowek + karty + stopka + uwaga;
}

/* Aparat i miniatury w formularzu zlecenia. */
function podepnijZdjecia(z){
  var lista = document.getElementById("f-zdjecia");
  var stanEl = document.getElementById("f-zdj-stan");
  var wejscie = document.getElementById("f-aparat");
  if(!lista || !wejscie) return;

  var narysuj = function(){
    var moje = zdjeciaZlecenia(z.id);
    if(!moje.length){
      lista.innerHTML = '<div class="zdj-pusto">Jeszcze nic tu nie ma.</div>';
      return;
    }
    lista.innerHTML = moje.map(function(f){
      return '<button type="button" class="zdj-kafel" data-zdjecie="' + f.id + '">' +
        '<span class="zdj-laduje">…</span>' +
        (f.plikId ? "" : '<span class="zdj-czeka">czeka</span>') + "</button>";
    }).join("");

    moje.forEach(function(f){
      var kafel = lista.querySelector('[data-zdjecie="' + f.id + '"]');
      if(!kafel) return;
      kafel.onclick = function(){ otworzPodglad(f.id); };
      zrodloZdjecia(f).then(function(uri){
        kafel.style.backgroundImage = "url(" + uri + ")";
        var l = kafel.querySelector(".zdj-laduje");
        if(l) l.remove();
      }).catch(function(){
        var l = kafel.querySelector(".zdj-laduje");
        if(l) l.textContent = "!";
      });
    });
  };
  narysuj();

  var otworzAparat = function(zAparatu){
    if(zAparatu) wejscie.setAttribute("capture", "environment");
    else wejscie.removeAttribute("capture");
    wejscie.value = "";
    wejscie.click();
  };
  document.getElementById("f-zrob-zdjecie").onclick = function(){ otworzAparat(true); };
  document.getElementById("f-wybierz-zdjecie").onclick = function(){ otworzAparat(false); };

  wejscie.onchange = function(){
    var plik = wejscie.files && wejscie.files[0];
    if(!plik) return;
    stanEl.innerHTML = '<div class="komunikat">Przygotowuję zdjęcie…</div>';
    zmniejszZdjecie(plik).then(function(uri){
      dodajZdjecie(z.id, uri);
      var kb = Math.round(uri.length * 0.75 / 1024);
      stanEl.innerHTML = '<div class="komunikat">Dodane (' + kb + " KB). " +
        (adresSync ? "Wyślę je do arkusza przy najbliższej synchronizacji."
                   : "Podłącz arkusz, żeby trafiło też na inne urządzenia.") + "</div>";
      narysuj();
    }).catch(function(e){
      stanEl.innerHTML = '<div class="komunikat">Nie udało się: ' + esc(e.message) + "</div>";
    });
  };
}
function zbierzZFormularza(){
  var z = stan.formularz;
  if(!z || !document.getElementById("f-data")) return z;
  z.data      = document.getElementById("f-data").value || dzisiaj();
  z.klient    = document.getElementById("f-klient").value.trim();
  z.opis      = document.getElementById("f-opis").value.trim();
  z.czas      = document.getElementById("f-czas").value.trim();
  z.od        = document.getElementById("f-od").value;
  z.do        = document.getElementById("f-do").value;
  z.km        = document.getElementById("f-km").value.trim();
  z.nastepnym = document.getElementById("f-nastepnym").value.trim();
  return z;
}

/* ============ kod QR do podłączenia kolejnego urządzenia ============
   Biblioteka do rysowania kodu dociąga się przy pierwszym otwarciu i zostaje
   w pamięci telefonu, więc następnym razem działa też bez zasięgu. */
var BIBLIOTEKA_QR = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
var qrWczytywanie = null;

function wczytajQr(){
  if(window.QRCode) return Promise.resolve(window.QRCode);
  if(qrWczytywanie) return qrWczytywanie;
  qrWczytywanie = new Promise(function(daj, odrzuc){
    var skrypt = document.createElement("script");
    skrypt.src = BIBLIOTEKA_QR;
    skrypt.onload = function(){
      if(window.QRCode) daj(window.QRCode);
      else { qrWczytywanie = null; odrzuc(new Error("biblioteka wczytana, ale pusta")); }
    };
    skrypt.onerror = function(){ qrWczytywanie = null; odrzuc(new Error("brak internetu")); };
    document.head.appendChild(skrypt);
  });
  return qrWczytywanie;
}

function linkZAdresem(){
  return location.origin + location.pathname + "#adres=" + encodeURIComponent(adresSync);
}

function otworzKodQr(){
  var polaczony = !!adresSync;
  document.getElementById("warstwa").innerHTML =
  '<div class="zaslona" id="zaslona"><div class="arkusz" role="dialog" aria-label="Kod QR">' +

/* ============ zdjęcia ze zleceń ============
   Zdjęcie z aparatu potrafi mieć 4 MB — tyle nie zmieści się w pamięci przeglądarki
   i niepotrzebnie długo by się wysyłało. Zmniejszamy je do 1400 px i zapisujemy
   jako JPEG, co daje zwykle 150–300 KB przy zachowanej czytelności napisów
   na urządzeniach. Plik idzie na Dysk Google, u nas zostaje sam wskaźnik. */
var MAKS_BOK_ZDJECIA = 1400;
var pamiecPodgladow = {};          // plikId -> data URI, tylko na czas działania aplikacji

function zmniejszZdjecie(plik){
  return new Promise(function(gotowe, nieudane){
    var czytnik = new FileReader();
    czytnik.onerror = function(){ nieudane(new Error("nie moge odczytać zdjęcia")); };
    czytnik.onload = function(){
      var obraz = new Image();
      obraz.onerror = function(){ nieudane(new Error("to nie wygląda na zdjęcie")); };
      obraz.onload = function(){
        var skala = Math.min(1, MAKS_BOK_ZDJECIA / Math.max(obraz.width, obraz.height));
        var p = document.createElement("canvas");
        p.width  = Math.round(obraz.width  * skala);
        p.height = Math.round(obraz.height * skala);
        var ctx = p.getContext("2d");
        ctx.drawImage(obraz, 0, 0, p.width, p.height);
        gotowe(p.toDataURL("image/jpeg", 0.78));
      };
      obraz.src = czytnik.result;
    };
    czytnik.readAsDataURL(plik);
  });
}

function zdjeciaZlecenia(idZlecenia){
  return Object.keys(stan.zdjecia)
    .map(function(k){ return stan.zdjecia[k]; })
    .filter(function(z){ return z.zlecenie === idZlecenia; })
    .sort(function(a, b){ return String(a.zmieniono).localeCompare(String(b.zmieniono)); });
}

function dodajZdjecie(idZlecenia, dataUri){
  var id = nowyId();
  stan.zdjecia[id] = { id:id, zlecenie:idZlecenia, nazwa:"zlecenie-" + dzisiaj() + ".jpg",
                       plikId:"", dane:dataUri, zmieniono:new Date().toISOString() };
  stan.czekajaZdjecia[id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}

function usunZdjecie(id){
  var z = stan.zdjecia[id];
  delete stan.zdjecia[id];
  stan.usunieteZdjecia[id] = new Date().toISOString();
  if(z && z.plikId) stan.usunieteZdjecia[id + "|plik"] = z.plikId;
  stan.czekajaZdjecia[id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}

/* Miniatura: dopóki zdjęcie czeka na wysyłkę, mamy je u siebie; potem ciągniemy
   je z Dysku przez skrypt arkusza i trzymamy w pamięci do zamknięcia aplikacji. */
function zrodloZdjecia(z){
  if(z.dane) return Promise.resolve(z.dane);
  if(!z.plikId) return Promise.reject(new Error("brak pliku"));
  if(pamiecPodgladow[z.plikId]) return Promise.resolve(pamiecPodgladow[z.plikId]);
  if(!adresSync) return Promise.reject(new Error("brak połączenia z arkuszem"));

  return fetch(adresSync + "?zdjecie=" + encodeURIComponent(z.plikId))
    .then(function(o){ return o.json(); })
    .then(function(odp){
      if(!odp || !odp.ok || !odp.dane) throw new Error((odp && odp.blad) || "arkusz nie oddał zdjęcia");
      var uri = "data:" + (odp.typ || "image/jpeg") + ";base64," + odp.dane;
      pamiecPodgladow[z.plikId] = uri;
      return uri;
    });
}

function otworzPodglad(id){
  var z = stan.zdjecia[id];
  if(!z) return;
  var warstwa = document.getElementById("warstwa-zdjecie");
  warstwa.innerHTML = '<div class="zdj-tlo" id="zdj-tlo">' +
    '<div class="zdj-pasek">' +
      '<button class="zdj-btn" id="zdj-zamknij">Zamknij</button>' +
      '<button class="zdj-btn groznie" id="zdj-usun">Usuń zdjęcie</button></div>' +
    '<div class="zdj-srodek" id="zdj-srodek">Ładuję…</div></div>';

  var zamknij = function(){ warstwa.innerHTML = ""; };
  document.getElementById("zdj-zamknij").onclick = zamknij;
  document.getElementById("zdj-tlo").onclick = function(e){
    if(e.target.id === "zdj-tlo") zamknij();
  };
  document.getElementById("zdj-usun").onclick = function(){
    usunZdjecie(id); zamknij(); rysujFormularz();
  };

  zrodloZdjecia(z).then(function(uri){
    document.getElementById("zdj-srodek").innerHTML =
      '<img src="' + uri + '" alt="Zdjęcie ze zlecenia">';
  }).catch(function(e){
    document.getElementById("zdj-srodek").textContent =
      "Nie mogę pokazać tego zdjęcia: " + e.message;
  });
}

/* ============ widok: Odpady (harmonogram gminy) ============
   Dane są na sztywno (ODPADY), bo to stały harmonogram na rok. Nic tu nie
   synchronizujemy — działa bez zasięgu i bez arkusza. Dopiero przycisk
   "Ustaw przypomnienia" robi z tych dat normalne terminy, które idą do
   Kalendarza Google i dzwonią. */

function odpadyOdDzis(){
  var dzis = dzisiaj();
  return ODPADY.filter(function(o){ return o.d >= dzis; });
}

function idPrzypOdpadow(data){ return "odpady-" + data; }

function ilePrzypomnienOdpadow(){
  var ile = 0;
  odpadyOdDzis().forEach(function(o){
    if(stan.przypomnienia[idPrzypOdpadow(o.d)]) ile++;
  });
  return ile;
}

/** Robi z harmonogramu normalne terminy: dzwonek dzień wcześniej o 6:30,
 *  żeby zdążyć wystawić pojemnik przed 7:00. PSZOK pomijamy — to nie wywóz,
 *  nie ma po co budzić. */
function ustawPrzypomnieniaOdpadow(){
  var ile = 0;
  odpadyOdDzis().forEach(function(o){
    if(o.t === "pszok") return;
    var r = RODZAJE_ODPADOW[o.t];
    var id = idPrzypOdpadow(o.d);
    stan.przypomnienia[id] = {
      id: id, zlecenie: "",
      tytul: "Odpady — " + r.krotko,
      notatka: "Wystaw przed 7:00. " +
               r.worki.map(function(w){ return w[1] + " (" + w[2] + ")"; }).join(", ") +
               (r.uwaga ? " " + r.uwaga : ""),
      data: o.d, godzina: "06:30", przedMin: "1440", powtarzanie: "",
      wydarzenieId: (stan.przypomnienia[id] || {}).wydarzenieId || "",
      odcisk: (stan.przypomnienia[id] || {}).odcisk || "",
      zmieniono: new Date().toISOString()
    };
    delete stan.usunietePrzyp[id];
    stan.czekajaPrzyp[id] = true;
    ile++;
  });
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
  return ile;
}

function usunPrzypomnieniaOdpadow(){
  var ile = 0;
  Object.keys(stan.przypomnienia).forEach(function(id){
    if(id.indexOf("odpady-") !== 0) return;
    usunTermin(id);
    ile++;
  });
  return ile;
}

function kartaNajblizszego(o){
  var r = RODZAJE_ODPADOW[o.t];
  var ileDni = Math.round((zKlucza(o.d) - zKlucza(dzisiaj())) / 86400000);
  var kiedy = ileDni === 0 ? "dziś" : ileDni === 1 ? "jutro"
            : "za " + ileDni + " " + odmiana(ileDni, "dzień", "dni", "dni");

  return '<div class="odp-karta odp-' + o.t + '">' +
    '<div class="odp-kiedy">' + esc(kiedy) + "</div>" +
    '<div class="odp-data">' + esc(dataDluga(o.d)) + "</div>" +
    '<div class="odp-co">' + esc(r.nazwa) + "</div>" +
    (r.worki.length
      ? '<div class="odp-worki">' + r.worki.map(function(w){
          return '<span class="worek w-' + w[0] + '">' + esc(w[1]) + "</span>";
        }).join("") + "</div>"
      : "") +
    (r.uwaga ? '<div class="odp-uwaga">' + esc(r.uwaga) + "</div>" : "") +
    (o.t !== "pszok"
      ? '<div class="odp-przed7">Wystaw pojemnik / worek <b>przed 7:00 rano</b></div>'
      : "") +
    "</div>";
}

function widokOdpady(){
  var dalsze = odpadyOdDzis();

  if(!dalsze.length){
    return '<div class="pusto"><div class="duze">Harmonogram ' + ODPADY_ROK + " się skończył</div>" +
      "<p>Wszystkie terminy z tego roku już minęły. Jak gmina wyda harmonogram " +
      "na kolejny rok, trzeba go wpisać do aplikacji.</p></div>";
  }

  var html = kartaNajblizszego(dalsze[0]);

  var ustawione = ilePrzypomnienOdpadow();
  var doUstawienia = dalsze.filter(function(o){ return o.t !== "pszok"; }).length;
  html += '<div class="odp-akcja">' +
    (ustawione
      ? '<div class="odp-stan">🔔 Przypomnienia ustawione (' + ustawione + ')</div>' +
        '<button class="wtorny" data-odpady="usun">Usuń przypomnienia</button>'
      : '<button class="glowny" data-odpady="ustaw">🔔 Ustaw przypomnienia (' +
        doUstawienia + ")</button>" +
        '<div class="odp-stan">Dzwonek dzień wcześniej o 6:30 — zdążysz wystawić przed 7:00</div>') +
    "</div>";

  if(dalsze.length > 1){
    html += '<div class="grupa-data">Dalej w tym roku</div><div class="lista">';
    dalsze.slice(1).forEach(function(o){
      var r = RODZAJE_ODPADOW[o.t];
      html += '<div class="wpis odp-wiersz">' +
        '<span class="pasek-statusu odp-pasek-' + o.t + '"></span>' +
        '<span class="wpis-tresc">' +
          '<span class="wpis-klient">' + esc(dataKrotka(o.d)) + " — " + esc(r.nazwa) + "</span>" +
          (r.worki.length
            ? '<span class="odp-worki male">' + r.worki.map(function(w){
                return '<span class="worek w-' + w[0] + '">' + esc(w[1]) + "</span>";
              }).join("") + "</span>"
            : '<span class="wpis-opis">' + esc(r.uwaga) + "</span>") +
        "</span></div>";
    });
    html += "</div>";
  }

  html += '<div class="grupa-data">Co znaczą kolory</div>' +
    '<div class="odp-legenda">' +
      Object.keys(RODZAJE_ODPADOW).map(function(k){
        var r = RODZAJE_ODPADOW[k];
        return '<div class="odp-leg odp-pasek-' + k + '"><b>' + esc(r.nazwa) + "</b>" +
          (r.worki.length
            ? " — " + esc(r.worki.map(function(w){ return w[1] + " (" + w[2] + ")"; }).join(", "))
            : "") +
          (r.uwaga ? '<span class="odp-leg-uwaga">' + esc(r.uwaga) + "</span>" : "") +
          "</div>";
      }).join("") +
    "</div>";

  html += '<div class="grupa-data">Oryginał z gminy</div>' +
    '<a class="odp-zdjecie" href="odpady-2026.jpg" target="_blank" rel="noopener">' +
      '<img src="odpady-2026.jpg" alt="Harmonogram odbioru odpadów, gmina Maciejowice 2026" ' +
      'loading="lazy"></a>' +
    '<p class="odp-zrodlo">EKOLIDER Jarosław Wyglądała Sp. z o.o., Lucin 4, 08-400 Garwolin. ' +
      "Dotknij obrazka, żeby otworzyć w pełnym rozmiarze.</p>";

  return html;
}

/* ============ zestawienie do PDF ============
   Nie dociągamy żadnej biblioteki — budujemy porządną tabelę i oddajemy ją
   oknu drukowania. Tam wybiera się „Zapisz jako PDF" (jest i w Windows,
   i w Chrome na Androidzie), więc działa też bez zasięgu. */

/* Zlecenia z danego zakresu, po dacie, a w obrębie dnia po godzinie rozpoczęcia. */
function zleceniaDoZestawienia(zakres){
  var lista = wszystkie();
  if(zakres !== "wszystko"){
    var przedrostek = stan.miesiac.r + "-" + pad(stan.miesiac.m + 1);
    lista = lista.filter(function(z){
      return String(z.data).slice(0, 7) === przedrostek;
    });
  }
  return lista.sort(function(a, b){
    if(a.data !== b.data) return a.data < b.data ? -1 : 1;
    return String(a.od || "") < String(b.od || "") ? -1 : 1;
  });
}

function tytulZestawienia(zakres){
  if(zakres === "wszystko") return "Wszystkie zlecenia";
  return MIESIACE[stan.miesiac.m].charAt(0).toUpperCase() +
         MIESIACE[stan.miesiac.m].slice(1) + " " + stan.miesiac.r;
}

function nazwaPliku(zakres){
  if(zakres === "wszystko") return "zlecenia-wszystkie";
  return "zlecenia-" + stan.miesiac.r + "-" + pad(stan.miesiac.m + 1);
}

function zestawienieHtml(zakres){
  var lista = zleceniaDoZestawienia(zakres);
  var teraz = new Date();
  var wydrukowano = dataKrotka(naKlucz(teraz)) + ", " + godzina(teraz);

  var html = "<h1>Dziennik zleceń — " + esc(tytulZestawienia(zakres)) + "</h1>" +
    '<p class="wy-podtytul">' + lista.length + " " +
    odmiana(lista.length, "zlecenie", "zlecenia", "zleceń") + "</p>";

  if(!lista.length){
    return html + '<p class="wy-pusto">Brak zleceń w tym zakresie.</p>' +
      '<p class="wy-stopka">Wydrukowano ' + esc(wydrukowano) + "</p>";
  }

  var sumaGodzin = 0, sumaKm = 0;

  html += "<table><thead><tr>" +
    "<th>Data</th><th>Dzień</th><th>Godziny</th><th>Czas</th>" +
    "<th>Klient</th><th>Opis</th><th>Km</th><th>Status</th>" +
    "</tr></thead><tbody>";

  lista.forEach(function(z){
    var d = zKlucza(z.data);
    var godziny = (z.od && z.do) ? (z.od + "–" + z.do) : (z.od || z.do || "");
    var g = parseFloat(String(z.czas || "").replace(",", "."));
    var k = parseFloat(String(z.km   || "").replace(",", "."));
    if(!isNaN(g)) sumaGodzin += g;
    if(!isNaN(k)) sumaKm += k;

    var opis = String(z.opis || "");
    if(z.nastepnym) opis += (opis ? " — " : "") + "Następnym razem: " + z.nastepnym;

    html += "<tr>" +
      "<td>" + esc(z.data || "") + "</td>" +
      "<td>" + esc(DNI_SKROT[dowPon(d)]) + "</td>" +
      '<td class="wy-godz">' + esc(godziny) + "</td>" +
      '<td class="wy-prawo">' + esc(czasTekst(z.czas)) + "</td>" +
      "<td>" + esc(z.klient || "") + "</td>" +
      "<td>" + esc(opis) + "</td>" +
      '<td class="wy-prawo">' + esc(kmTekst(z.km)) + "</td>" +
      "<td>" + esc((STATUSY[z.status] || STATUSY.zrobione).nazwa) + "</td>" +
      "</tr>";
  });

  html += "</tbody></table>" +
    '<p class="wy-suma">Razem: ' + lista.length + " " +
      odmiana(lista.length, "zlecenie", "zlecenia", "zleceń") +
      " · " + liczba(sumaGodzin) + " h" +
      (sumaKm ? " · " + liczba(sumaKm) + " km" : "") + "</p>";

  // Rozbicie na firmy — ile godzin łącznie zeszło u kogo.
  var firmy = czasWgFirm(zakres);
  if(firmy.length){
    html += '<h2 class="wy-naglowek2">Czas wg firm</h2>' +
      "<table><thead><tr><th>Firma</th><th>Zleceń</th><th>Godziny</th><th>Km</th>" +
      "</tr></thead><tbody>";
    firmy.forEach(function(f){
      html += "<tr><td>" + esc(f.nazwa) + "</td>" +
        '<td class="wy-prawo">' + f.ile + "</td>" +
        '<td class="wy-prawo">' + liczba(f.godz) + " h</td>" +
        '<td class="wy-prawo">' + (f.km ? liczba(f.km) + " km" : "") + "</td></tr>";
    });
    html += '<tr class="wy-razem"><td>Razem</td>' +
      '<td class="wy-prawo">' + lista.length + "</td>" +
      '<td class="wy-prawo">' + liczba(sumaGodzin) + " h</td>" +
      '<td class="wy-prawo">' + (sumaKm ? liczba(sumaKm) + " km" : "") + "</td></tr>" +
      "</tbody></table>";
  }

  html += '<p class="wy-stopka">Wydrukowano ' + esc(wydrukowano) + "</p>";

  return html;
}

/* ---- Excel ----
   Zwykły CSV, ale przygotowany pod polskiego Excela: średnik jako separator,
   przecinek dziesiętny i BOM na początku, żeby ogonki się nie rozsypały. */
function polaCsv(v){
  var s = String(v == null ? "" : v);
  return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvZlecen(zakres){
  var lista = zleceniaDoZestawienia(zakres);
  var wiersze = [["Data","Dzień","Od","Do","Czas (h)","Klient","Opis",
                  "Następnym razem","Km","Status"]];
  var sumaGodzin = 0, sumaKm = 0;

  lista.forEach(function(z){
    var g = parseFloat(String(z.czas || "").replace(",", "."));
    var k = parseFloat(String(z.km   || "").replace(",", "."));
    if(!isNaN(g)) sumaGodzin += g;
    if(!isNaN(k)) sumaKm += k;
    wiersze.push([
      z.data || "",
      DNI_SKROT[dowPon(zKlucza(z.data))],
      z.od || "", z.do || "",
      isNaN(g) ? "" : liczba(g),
      z.klient || "", z.opis || "", z.nastepnym || "",
      isNaN(k) ? "" : liczba(k),
      (STATUSY[z.status] || STATUSY.zrobione).nazwa
    ]);
  });

  wiersze.push([]);
  wiersze.push(["Razem", "", "", "", liczba(sumaGodzin), "", "", "", liczba(sumaKm), ""]);

  // Druga tabelka w tym samym pliku: ile godzin łącznie u której firmy.
  var firmy = czasWgFirm(zakres);
  if(firmy.length){
    wiersze.push([]);
    wiersze.push(["CZAS WG FIRM"]);
    wiersze.push(["Firma", "Zleceń", "Godziny", "Km"]);
    firmy.forEach(function(f){
      wiersze.push([f.nazwa, f.ile, liczba(f.godz), f.km ? liczba(f.km) : ""]);
    });
    wiersze.push(["Razem", lista.length, liczba(sumaGodzin), liczba(sumaKm)]);
  }

  return "﻿" + wiersze.map(function(w){
    return w.map(polaCsv).join(";");
  }).join("\r\n");
}

/* ---- tekst do wklejenia w wiadomość ----
   Bez tabel i średników — tak, żeby dało się to wysłać SMS-em albo mailem
   i żeby dało się to przeczytać. Dni oddzielone pustą linią. */
function tekstZlecen(zakres){
  var lista = zleceniaDoZestawienia(zakres);
  if(!lista.length) return "Brak zleceń w tym zakresie.";

  var wiersze = [zakres === "wszystko" ? "Zlecenia — wszystkie"
                                       : "Zlecenia — " + tytulZestawienia(zakres), ""];
  var sumaGodzin = 0;
  var poprzedniDzien = "";

  lista.forEach(function(z){
    if(z.data !== poprzedniDzien){
      if(poprzedniDzien) wiersze.push("");
      var d = zKlucza(z.data);
      wiersze.push(d.getDate() + "." + pad(d.getMonth() + 1) + " (" +
                   DNI_SKROT[dowPon(d)].toLowerCase() + ")");
      poprzedniDzien = z.data;
    }
    var g = parseFloat(String(z.czas || "").replace(",", "."));
    if(!isNaN(g)) sumaGodzin += g;

    var godziny = (z.od && z.do) ? z.od + "–" + z.do
                : (z.czas ? czasTekst(z.czas) : "");
    var linia = "• " + (z.klient || "bez klienta");
    if(godziny) linia += ", " + godziny;
    if(z.opis) linia += " — " + z.opis;
    wiersze.push(linia);
    if(z.nastepnym) wiersze.push("  (na następny raz: " + z.nastepnym + ")");
  });

  wiersze.push("");
  wiersze.push("Razem: " + lista.length + " " +
    odmiana(lista.length, "zlecenie", "zlecenia", "zleceń") +
    (sumaGodzin ? ", " + liczba(sumaGodzin) + " h" : ""));

  return wiersze.join("\n");
}

function tekstDoWiadomosci(zakres){
  pokazTekst(tekstZlecen(zakres), nazwaPliku(zakres));
}

/* Jeden mechanizm dla wszystkich zestawień tekstowych: do schowka, podgląd, plik. */
function pokazTekst(tekst, nazwa){
  var wynik = document.getElementById("m-wynik");

  var pokaz = function(naglowek){
    wynik.innerHTML = '<div class="komunikat">' + naglowek +
      '<textarea class="podglad-tekstu" readonly>' + esc(tekst) + "</textarea>" +
      '<div class="przyciski"><button class="wtorny" id="m-txt-plik">Pobierz jako plik .txt</button>' +
      '<button class="wtorny" id="m-txt-kopiuj">Kopiuj jeszcze raz</button></div></div>';
    document.getElementById("m-txt-plik").onclick = function(){
      pobierzPlik(nazwa + ".txt", tekst, "text/plain;charset=utf-8");
    };
    document.getElementById("m-txt-kopiuj").onclick = function(){
      var p = wynik.querySelector("textarea");
      p.focus(); p.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(tekst).catch(function(){});
      }
    };
    var p = wynik.querySelector("textarea");
    if(p && !navigator.clipboard){ p.focus(); p.select(); }
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(tekst).then(function(){
      pokaz("<b>Skopiowane do schowka.</b> Wklej w wiadomości — albo pobierz plikiem:");
    }).catch(function(){
      pokaz("Gotowe do wklejenia — zaznacz i skopiuj, albo pobierz plikiem:");
    });
  } else {
    pokaz("Gotowe do wklejenia — zaznacz i skopiuj, albo pobierz plikiem:");
  }
}

function pobierzExcel(zakres){
  var nazwa = nazwaPliku(zakres) + ".csv";
  var wynik = document.getElementById("m-wynik");
  try{
    var blob = new Blob([csvZlecen(zakres)], { type:"text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nazwa;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    if(wynik) wynik.innerHTML = '<div class="komunikat">Zapisane jako ' + esc(nazwa) +
      " — otwórz w Excelu albo w Arkuszach Google.</div>";
  }catch(e){
    if(wynik) wynik.innerHTML = '<div class="komunikat">Nie udało się zapisać pliku: ' +
      esc(e.message) + "</div>";
  }
}

      '<td class="wy-prawo">' + esc(zlotowki(pod.wartosc)) + "</td></tr></tbody></table>";
  }

  return html + '<p class="wy-stopka">Wydrukowano ' +
    esc(dataKrotka(naKlucz(teraz)) + ", " + godzina(teraz)) + "</p>";
}

/* ---- teksty do wiadomości dla "innych" i zamówień ---- */
function tekstInne(){
  var lista = wszystkieInne();
  var pod = podsumowanieInnych();
  if(!lista.length) return "Inne zlecenia — nic tu nie ma.";

  var w = ["Inne zlecenia — bez daty", ""];
  var doZrobienia = lista.filter(function(i){ return i.status !== "zrobione"; });
  var zrobione = lista.filter(function(i){ return i.status === "zrobione"; });

  doZrobienia.forEach(function(i){
    var linia = "• " + (i.klient || "bez klienta");
    if(i.opis) linia += " — " + i.opis;
    if(i.czas) linia += " (" + czasTekst(i.czas) + ")";
    w.push(linia);
  });

  if(zrobione.length){
    w.push("");
    w.push("Zrobione:");
    zrobione.forEach(function(i){
      var linia = "• " + (i.klient || "bez klienta");
      if(i.opis) linia += " — " + i.opis;
      w.push(linia);
    });
  }

  w.push("");
  w.push("Do zrobienia: " + pod.doZrobienia + " z " + pod.ile +
    (pod.godz ? ", razem " + liczba(pod.godz) + " h szacowane" : ""));
  return w.join("\n");
}

function tekstZamowien(){
  var lista = wszystkieZamowienia();
  var pod = podsumowanieZamowien();
  if(!lista.length) return "Co trzeba zamówić — lista jest pusta.";

  var w = ["Co trzeba zamówić", ""];
  var poStanie = { doZamowienia:[], zamowione:[], dostarczone:[] };
  lista.forEach(function(z){
    (poStanie[z.status] || poStanie.doZamowienia).push(z);
  });

  var wypisz = function(grupa, naglowek){
    if(!grupa.length) return;
    if(naglowek){ w.push(naglowek); }
    grupa.forEach(function(z){
      var linia = "• " + (z.rzecz || "bez nazwy");
      if(z.ilosc) linia += " — " + liczba(parseFloat(String(z.ilosc).replace(",", ".")) || 0) + " szt.";
      var wart = wartoscZamowienia(z);
      if(wart !== null) linia += " × " + liczba(parseFloat(String(z.cena).replace(",", "."))) +
        " zł = " + zlotowki(wart);
      if(z.klient) linia += " — dla " + z.klient;
      w.push(linia);
    });
    w.push("");
  };

  wypisz(poStanie.doZamowienia, "");
  wypisz(poStanie.zamowione, "Już zamówione:");
  wypisz(poStanie.dostarczone, "Dostarczone:");

  w.push("Razem: " + pod.ile + " " + odmiana(pod.ile, "pozycja", "pozycje", "pozycji") +
    (pod.sztuk ? ", " + liczba(pod.sztuk) + " szt." : "") +
    (pod.wartosc ? ", " + zlotowki(pod.wartosc) : ""));

  var firmy = zamowieniaWgFirm();
  if(firmy.length > 1){
    w.push("");
    w.push("Wg firm:");
    firmy.forEach(function(f){
      w.push("• " + f.nazwa + ": " + (f.sztuk ? liczba(f.sztuk) + " szt." : "") +
        (f.wartosc ? (f.sztuk ? ", " : "") + zlotowki(f.wartosc) : ""));
    });
  }
  return w.join("\n");
}

function csvInne(){
  var lista = wszystkieInne();
  var pod = podsumowanieInnych();
  var w = [["Klient","Co do zrobienia","Szacowany czas (h)","Stan"]];
  lista.forEach(function(i){
    var g = parseFloat(String(i.czas || "").replace(",", "."));
    w.push([i.klient || "", i.opis || "", isNaN(g) ? "" : liczba(g),
            (STATUSY_INNE[i.status] || STATUSY_INNE.czeka).nazwa]);
  });
  w.push([]);
  w.push(["Razem", lista.length, pod.godz ? liczba(pod.godz) : "", ""]);
  return "﻿" + w.map(function(r){ return r.map(polaCsv).join(";"); }).join("\r\n");
}

function csvZamowien(){
  var lista = wszystkieZamowienia();
  var pod = podsumowanieZamowien();
  var w = [["Co","Dla kogo","Ilość","Cena za szt.","Wartość","Stan"]];
  lista.forEach(function(z){
    var wart = wartoscZamowienia(z);
    var c = parseFloat(String(z.cena || "").replace(",", "."));
    var il = parseFloat(String(z.ilosc || "").replace(",", "."));
    w.push([z.rzecz || "", z.klient || "",
            isNaN(il) ? "" : liczba(il),
            isNaN(c) ? "" : liczba(c),
            wart === null ? "" : liczba(wart),
            (STATUSY_ZAM[z.status] || STATUSY_ZAM.doZamowienia).nazwa]);
  });
  w.push([]);
  w.push(["Razem", "", pod.sztuk ? liczba(pod.sztuk) : "", "", liczba(pod.wartosc), ""]);

  var firmy = zamowieniaWgFirm();
  if(firmy.length > 1){
    w.push([]);
    w.push(["ZAMÓWIENIA WG FIRM"]);
    w.push(["Firma","Pozycji","Sztuk","Wartość"]);
    firmy.forEach(function(f){
      w.push([f.nazwa, f.ile, f.sztuk ? liczba(f.sztuk) : "", f.wartosc ? liczba(f.wartosc) : ""]);
    });
    w.push(["Razem", pod.ile, pod.sztuk ? liczba(pod.sztuk) : "", liczba(pod.wartosc)]);
  }
  return "﻿" + w.map(function(r){ return r.map(polaCsv).join(";"); }).join("\r\n");
}

function pobierzPlik(nazwa, tresc, typ){
  var wynik = document.getElementById("m-wynik");
  try{
    var url = URL.createObjectURL(new Blob([tresc], { type: typ }));
    var a = document.createElement("a");
    a.href = url; a.download = nazwa;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    if(wynik) wynik.innerHTML = '<div class="komunikat">Zapisane jako ' + esc(nazwa) + "</div>";
  }catch(e){
    if(wynik) wynik.innerHTML = '<div class="komunikat">Nie udało się zapisać pliku: ' +
      esc(e.message) + "</div>";
  }
}

/* Wspólna droga do okna drukowania — dostaje gotowy HTML i nazwę pliku. */
function drukujHtml(html, nazwa){
  document.getElementById("wydruk").innerHTML = html;
  var tytulStrony = document.title;
  document.title = nazwa;
  var przywroc = function(){ document.title = tytulStrony; };
  window.addEventListener("afterprint", function raz(){
    przywroc(); window.removeEventListener("afterprint", raz);
  });
  setTimeout(przywroc, 60000);
  window.print();
}

function drukujZestawienie(zakres){
  document.getElementById("wydruk").innerHTML = zestawienieHtml(zakres);

  // Przeglądarka bierze nazwę pliku PDF z tytułu strony — podmieniamy na czas druku.
  var tytulStrony = document.title;
  document.title = nazwaPliku(zakres);
  var przywroc = function(){ document.title = tytulStrony; };
  window.addEventListener("afterprint", function raz(){
    przywroc();
    window.removeEventListener("afterprint", raz);
  });
  setTimeout(przywroc, 60000);          // zapasowo, gdyby afterprint nie przyszedł

  window.print();
}

/* ============ skrypt do Arkusza Google ============
   Trzymamy go tutaj, żeby dało się go wkleić do Apps Script z dowolnego
   urządzenia — także wtedy, gdy nie masz przy sobie plików projektu.
   Po zmianie arkusz-google.gs trzeba odświeżyć tę stałą. */
var SKRYPT_ARKUSZA = [
  "/**",
  " * Dziennik zleceń — magazyn w Arkuszu Google.",
  " *",
  " * Ten skrypt wkleja się w Arkuszu: Rozszerzenia → Apps Script,",
  " * a potem wdraża jako aplikację internetową (Wdróż → Nowe wdrożenie →",
  " * Aplikacja internetowa → Uruchom jako: ja, Kto ma dostęp: wszyscy).",
  " * Adres kończący się na /exec wklejasz w aplikacji: ⋯ → Adres Arkusza Google.",
  " *",
  " * Arkusze \"Zlecenia\", \"Klienci\", \"Inne\", \"Zamowienia\" i \"Przypomnienia\" robią się",
  " * same przy pierwszym zapisie.",
  " * Przy sprzeczce wygrywa wpis z późniejszym znacznikiem \"zmieniono\".",
  " * Skasowane zlecenia zostają w arkuszu z datą w kolumnie \"usuniete\" —",
  " * dzięki temu kasowanie dochodzi też do pozostałych urządzeń.",
  " *",
  " * PRZYPOMNIENIA I KALENDARZ: przy zleceniu można ustawić datę przypomnienia",
  " * o tym, co zostało \"na następny raz\". Taki termin ląduje jako wydarzenie",
  " * w osobnym kalendarzu \"Przypomnienia\", a dzwoni systemowy Kalendarz Google —",
  " * przeglądarka w telefonie nie umie sama odpalić powiadomienia przy zamkniętej",
  " * aplikacji. Zlecenia NIE trafiają do kalendarza, tylko same przypomnienia.",
  " *",
  " * WAŻNE: strefa czasowa musi być polska, inaczej powiadomienia przyjdą o złej",
  " * godzinie. Ustawienia projektu (koło zębate) → Strefa czasowa → Warszawa.",
  " * Po dodaniu kalendarza trzeba raz uruchomić z ręki funkcję \"sprawdz\",",
  " * żeby Google zapytał o zgodę na kalendarz, i zrobić NOWE wdrożenie.",
  " */",
  "",
  "const ARKUSZ_ZLECENIA = 'Zlecenia';",
  "const ARKUSZ_KLIENCI = 'Klienci';",
  "const ARKUSZ_INNE = 'Inne';",
  "const ARKUSZ_ZAMOWIENIA = 'Zamowienia';",
  "const ARKUSZ_ZDJECIA = 'Zdjecia';",
  "const ARKUSZ_PRZYPOMNIEN = 'Przypomnienia';",
  "const FOLDER_ZDJEC = 'Dziennik zlecen - zdjecia';",
  "const NAZWA_KALENDARZA = 'Przypomnienia';",
  "const DLUGOSC_MINUT = 30;          // ile trwa wydarzenie w kalendarzu",
  "",
  "const KOLUMNY_ZLECENIA = ['id', 'data', 'od', 'do', 'czas', 'km', 'klient', 'opis',",
  "                          'status', 'nastepnym', 'zmieniono', 'usuniete'];",
  "const KOLUMNY_KLIENCI = ['klucz', 'nazwa', 'km', 'zmieniono', 'usuniete'];",
  "const KOLUMNY_INNE = ['id', 'klient', 'opis', 'czas', 'status', 'zmieniono', 'usuniete'];",
  "const KOLUMNY_ZAMOWIENIA = ['id', 'rzecz', 'ilosc', 'cena', 'klient', 'status',",
  "                            'zmieniono', 'usuniete'];",
  "const KOLUMNY_ZDJECIA = ['id', 'zlecenie', 'nazwa', 'plikId', 'zmieniono', 'usuniete'];",
  "// \"wydarzenieId\" i \"odcisk\" nadaje ten skrypt; aplikacja tylko je odsyła z powrotem,",
  "// tak samo jak \"plikId\" przy zdjęciach.",
  "// \"zlecenie\" puste = termin własny z zakładki Terminy (ubezpieczenie, przegląd),",
  "// wypełnione = przypomnienie o tym, co zostało przy zleceniu \"na następny raz\".",
  "// \"powtarzanie\": \"\" | dzien | tydzien | miesiac | rok — tylko dla terminów własnych.",
  "const KOLUMNY_PRZYPOMNIEN = ['id', 'zlecenie', 'tytul', 'notatka', 'data', 'godzina',",
  "                             'przedMin', 'powtarzanie', 'wydarzenieId', 'odcisk',",
  "                             'zmieniono', 'usuniete'];",
  "",
  "function doGet(e) {",
  "  const plikId = e && e.parameter && e.parameter.zdjecie;",
  "  if (plikId) return odpowiedz(pobierzZdjecie(plikId));",
  "  return odpowiedz(wszystko());",
  "}",
  "",
  "function doPost(e) {",
  "  const blokada = LockService.getScriptLock();",
  "  try {",
  "    blokada.waitLock(25000);",
  "  } catch (err) {",
  "    return odpowiedz({ ok: false, blad: 'arkusz zajety, sprobuj za chwile' });",
  "  }",
  "  try {",
  "    const dane = JSON.parse((e && e.postData && e.postData.contents) || '{}');",
  "    if (Array.isArray(dane.zlecenia)) {",
  "      scal(ARKUSZ_ZLECENIA, KOLUMNY_ZLECENIA, dane.zlecenia);",
  "    }",
  "    if (Array.isArray(dane.klienci)) {",
  "      scal(ARKUSZ_KLIENCI, KOLUMNY_KLIENCI, dane.klienci);",
  "    }",
  "    if (Array.isArray(dane.inne)) {",
  "      scal(ARKUSZ_INNE, KOLUMNY_INNE, dane.inne);",
  "    }",
  "    if (Array.isArray(dane.zamowienia)) {",
  "      scal(ARKUSZ_ZAMOWIENIA, KOLUMNY_ZAMOWIENIA, dane.zamowienia);",
  "    }",
  "    if (Array.isArray(dane.zdjecia)) {",
  "      zapiszZdjecia(dane.zdjecia);",
  "    }",
  "    // Przypomnienia na końcu: najpierw do arkusza, potem doprowadzamy kalendarz",
  "    // do zgodności. Błąd kalendarza nie może wywrócić zapisu zleceń, dlatego",
  "    // ostrzeżenia tylko zbieramy i oddajemy aplikacji.",
  "    let ostrzezenia = [];",
  "    if (Array.isArray(dane.przypomnienia)) {",
  "      scal(ARKUSZ_PRZYPOMNIEN, KOLUMNY_PRZYPOMNIEN,",
  "           uzupelnijPolaSerwera(dane.przypomnienia));",
  "      ostrzezenia = odswiezKalendarz();",
  "    }",
  "    return odpowiedz(wszystko(ostrzezenia));",
  "  } catch (err) {",
  "    return odpowiedz({ ok: false, blad: String(err) });",
  "  } finally {",
  "    blokada.releaseLock();",
  "  }",
  "}",
  "",
  "function wszystko(ostrzezenia) {",
  "  return {",
  "    ok: true,",
  "    zlecenia: czytaj(ARKUSZ_ZLECENIA, KOLUMNY_ZLECENIA),",
  "    klienci: czytaj(ARKUSZ_KLIENCI, KOLUMNY_KLIENCI),",
  "    inne: czytaj(ARKUSZ_INNE, KOLUMNY_INNE),",
  "    zamowienia: czytaj(ARKUSZ_ZAMOWIENIA, KOLUMNY_ZAMOWIENIA),",
  "    zdjecia: czytaj(ARKUSZ_ZDJECIA, KOLUMNY_ZDJECIA),",
  "    przypomnienia: czytaj(ARKUSZ_PRZYPOMNIEN, KOLUMNY_PRZYPOMNIEN),",
  "    ostrzezenia: ostrzezenia || [],",
  "    czas: new Date().toISOString()",
  "  };",
  "}",
  "",
  "/** Arkusz o danej nazwie; jak go nie ma — zakłada go z nagłówkiem.",
  " *  Cały zakres ustawiamy na format tekstowy, żeby Arkusze nie zamieniały",
  " *  \"2026-09-10\" na datę, a \"09:00\" na godzinę. */",
  "function arkusz(nazwa, kolumny) {",
  "  const plik = SpreadsheetApp.getActiveSpreadsheet();",
  "  let ark = plik.getSheetByName(nazwa);",
  "  if (!ark) {",
  "    ark = plik.insertSheet(nazwa);",
  "    ark.getRange(1, 1, ark.getMaxRows(), kolumny.length).setNumberFormat('@');",
  "    ark.getRange(1, 1, 1, kolumny.length).setValues([kolumny]).setFontWeight('bold');",
  "    ark.setFrozenRows(1);",
  "  }",
  "  return ark;",
  "}",
  "",
  "function czytaj(nazwa, kolumny) {",
  "  const wiersze = arkusz(nazwa, kolumny).getDataRange().getValues();",
  "  const wynik = [];",
  "  for (let i = 1; i < wiersze.length; i++) {",
  "    if (!String(wiersze[i][0] || '')) continue;",
  "    const obiekt = {};",
  "    kolumny.forEach(function (nazwaKolumny, j) {",
  "      const wartosc = wiersze[i][j];",
  "      obiekt[nazwaKolumny] = wartosc == null ? '' : String(wartosc);",
  "    });",
  "    wynik.push(obiekt);",
  "  }",
  "  return wynik;",
  "}",
  "",
  "/** Dopisuje nowe wiersze, a istniejące nadpisuje tylko wtedy,",
  " *  gdy przychodzący wpis jest nowszy. Klucz zawsze w pierwszej kolumnie. */",
  "function scal(nazwa, kolumny, przychodzace) {",
  "  const ark = arkusz(nazwa, kolumny);",
  "  const wiersze = ark.getDataRange().getValues();",
  "  const kolumnaZmieniono = kolumny.indexOf('zmieniono');",
  "",
  "  const numerWiersza = {};",
  "  for (let i = 1; i < wiersze.length; i++) {",
  "    const klucz = String(wiersze[i][0] || '');",
  "    if (klucz) numerWiersza[klucz] = i + 1;",
  "  }",
  "",
  "  const doDopisania = [];",
  "  przychodzace.forEach(function (obiekt) {",
  "    const klucz = String(obiekt[kolumny[0]] || '');",
  "    if (!klucz) return;",
  "    const nowy = kolumny.map(function (nazwaKolumny) {",
  "      const wartosc = obiekt[nazwaKolumny];",
  "      return wartosc == null ? '' : String(wartosc);",
  "    });",
  "    const nr = numerWiersza[klucz];",
  "    if (!nr) {",
  "      doDopisania.push(nowy);",
  "      return;",
  "    }",
  "    const staraData = String(wiersze[nr - 1][kolumnaZmieniono] || '');",
  "    const nowaData = String(obiekt.zmieniono || '');",
  "    if (nowaData >= staraData) {",
  "      ark.getRange(nr, 1, 1, kolumny.length).setValues([nowy]);",
  "    }",
  "  });",
  "",
  "  if (doDopisania.length) {",
  "    ark.getRange(ark.getLastRow() + 1, 1, doDopisania.length, kolumny.length)",
  "       .setValues(doDopisania);",
  "  }",
  "}",
  "",
  "function odpowiedz(obiekt) {",
  "  return ContentService.createTextOutput(JSON.stringify(obiekt))",
  "    .setMimeType(ContentService.MimeType.JSON);",
  "}",
  "",
  "/* ============ zdjęcia ============",
  "   Zdjęcia nie leżą w arkuszu — arkusz trzyma tylko wiersz z identyfikatorem pliku,",
  "   a sam plik ląduje w folderze na Dysku. Dzięki temu arkusz zostaje lekki,",
  "   a zdjęcia nie zapychają pamięci telefonu.",
  "   Pliki NIE są udostępniane publicznie — aplikacja pobiera je przez ten skrypt,",
  "   więc widzi je tylko ten, kto zna adres /exec. */",
  "",
  "function folderZdjec() {",
  "  const foldery = DriveApp.getFoldersByName(FOLDER_ZDJEC);",
  "  return foldery.hasNext() ? foldery.next() : DriveApp.createFolder(FOLDER_ZDJEC);",
  "}",
  "",
  "/** Przyjmuje zdjęcia jako base64, zapisuje na Dysku, w arkuszu zostawia sam wskaźnik. */",
  "function zapiszZdjecia(lista) {",
  "  const doArkusza = [];",
  "  lista.forEach(function (z) {",
  "    if (!z || !z.id) return;",
  "",
  "    if (z.usuniete) {                       // nagrobek — kasujemy też plik z Dysku",
  "      if (z.plikId) {",
  "        try { DriveApp.getFileById(z.plikId).setTrashed(true); } catch (err) { /* już go nie ma */ }",
  "      }",
  "      doArkusza.push({ id: z.id, zlecenie: z.zlecenie || '', nazwa: '', plikId: '',",
  "                       zmieniono: z.usuniete, usuniete: z.usuniete });",
  "      return;",
  "    }",
  "",
  "    if (z.plikId) { doArkusza.push(z); return; }      // już wcześniej wysłane",
  "    if (!z.dane) return;",
  "",
  "    const czesci = String(z.dane).split(',');",
  "    const bajty = Utilities.base64Decode(czesci[czesci.length - 1]);",
  "    const blob = Utilities.newBlob(bajty, 'image/jpeg', z.nazwa || (z.id + '.jpg'));",
  "    const plik = folderZdjec().createFile(blob);",
  "",
  "    doArkusza.push({ id: z.id, zlecenie: z.zlecenie || '', nazwa: plik.getName(),",
  "                     plikId: plik.getId(), zmieniono: z.zmieniono || '', usuniete: '' });",
  "  });",
  "",
  "  if (doArkusza.length) scal(ARKUSZ_ZDJECIA, KOLUMNY_ZDJECIA, doArkusza);",
  "  return doArkusza;",
  "}",
  "",
  "/** Zwraca jedno zdjęcie jako base64 — aplikacja robi z tego podgląd. */",
  "function pobierzZdjecie(plikId) {",
  "  try {",
  "    const plik = DriveApp.getFileById(plikId);",
  "    return { ok: true, plikId: plikId, typ: plik.getMimeType(),",
  "             dane: Utilities.base64Encode(plik.getBlob().getBytes()) };",
  "  } catch (err) {",
  "    return { ok: false, blad: 'nie moge otworzyc zdjecia: ' + String(err) };",
  "  }",
  "}",
  "",
  "/* ============ przypomnienia w kalendarzu ============",
  "   Aplikacja zapisuje, o czym i kiedy przypomnieć. Tutaj z tego robimy wydarzenie",
  "   w kalendarzu Google — bo to on umie zadzwonić, gdy aplikacja jest zamknięta.",
  "   Kalendarz jest osobny (\"Przypomnienia\"), żeby dał się schować jednym kliknięciem",
  "   i nie mieszał się z normalnymi spotkaniami. */",
  "",
  "function kalendarz() {",
  "  const pamiec = PropertiesService.getScriptProperties();",
  "  const zapisany = pamiec.getProperty('kalendarzId');",
  "  if (zapisany) {",
  "    const kal = CalendarApp.getCalendarById(zapisany);",
  "    if (kal) return kal;",
  "  }",
  "  const istniejace = CalendarApp.getCalendarsByName(NAZWA_KALENDARZA);",
  "  const kal = istniejace.length",
  "    ? istniejace[0]",
  "    : CalendarApp.createCalendar(NAZWA_KALENDARZA, {",
  "        summary: 'Przypomnienia z Dziennika zlecen', color: CalendarApp.Color.ORANGE",
  "      });",
  "  pamiec.setProperty('kalendarzId', kal.getId());",
  "  return kal;",
  "}",
  "",
  "/** \"wydarzenieId\" i \"odcisk\" należą do tego skryptu, nie do telefonu. Jeśli",
  " *  przychodzący wpis ich nie ma (np. nagrobek albo telefon ze starszą wersją",
  " *  aplikacji), dokładamy je z arkusza. Bez tego zapis wyczyściłby wydarzenieId",
  " *  i osierocone wydarzenie zostałoby w kalendarzu — nie byłoby już czego usunąć. */",
  "function uzupelnijPolaSerwera(przychodzace) {",
  "  const ark = arkusz(ARKUSZ_PRZYPOMNIEN, KOLUMNY_PRZYPOMNIEN);",
  "  const wiersze = ark.getDataRange().getValues();",
  "  const kolWyd = KOLUMNY_PRZYPOMNIEN.indexOf('wydarzenieId');",
  "  const kolOdc = KOLUMNY_PRZYPOMNIEN.indexOf('odcisk');",
  "",
  "  const wArkuszu = {};",
  "  for (let i = 1; i < wiersze.length; i++) {",
  "    const klucz = String(wiersze[i][0] || '');",
  "    if (klucz) {",
  "      wArkuszu[klucz] = { wydarzenieId: String(wiersze[i][kolWyd] || ''),",
  "                          odcisk: String(wiersze[i][kolOdc] || '') };",
  "    }",
  "  }",
  "",
  "  return przychodzace.map(function (p) {",
  "    const stary = wArkuszu[String(p && p.id || '')];",
  "    if (!stary) return p;",
  "    const kopia = {};",
  "    Object.keys(p).forEach(function (k) { kopia[k] = p[k]; });",
  "    if (!kopia.wydarzenieId) kopia.wydarzenieId = stary.wydarzenieId;",
  "    if (!kopia.odcisk) kopia.odcisk = stary.odcisk;",
  "    return kopia;",
  "  });",
  "}",
  "",
  "/** Po czym poznajemy, że wydarzenie trzeba przerobić od nowa. */",
  "function odciskPrzypomnienia(p) {",
  "  return [p.tytul, p.notatka, p.data, p.godzina, p.przedMin, p.powtarzanie]",
  "    .map(function (x) { return String(x || ''); }).join('|');",
  "}",
  "",
  "/** Reguła powtarzania dla Kalendarza Google. Pusto = termin jednorazowy. */",
  "function powtarzanieNa(rodzaj) {",
  "  const r = CalendarApp.newRecurrence();",
  "  if (rodzaj === 'dzien')   return r.addDailyRule();",
  "  if (rodzaj === 'tydzien') return r.addWeeklyRule();",
  "  if (rodzaj === 'miesiac') return r.addMonthlyRule();",
  "  if (rodzaj === 'rok')     return r.addYearlyRule();",
  "  return null;",
  "}",
  "",
  "/** Tekst na datę — ostro, bo w arkuszu ktoś może wpisać co chce.",
  " *  Sam split('-') nie wystarcza: \"15-09-2026\" ma trzy części i JavaScript",
  " *  zrobiłby z tego datę w roku 15, a potem po cichu przewinął ją na coś",
  " *  istniejącego. Wtedy w kalendarzu wylądowałby bzdurny termin zamiast błędu. */",
  "function naDateGodzine(data, godzina) {",
  "  const d = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(data || ''));",
  "  if (!d) return null;",
  "  const rok = +d[1], mies = +d[2], dzien = +d[3];",
  "  if (mies < 1 || mies > 12 || dzien < 1 || dzien > 31) return null;",
  "",
  "  const g = /^(\\d{1,2}):(\\d{2})$/.exec(String(godzina || ''));",
  "  const godz = g ? +g[1] : 9, min = g ? +g[2] : 0;",
  "  if (godz > 23 || min > 59) return null;",
  "",
  "  const wynik = new Date(rok, mies - 1, dzien, godz, min, 0, 0);",
  "  // 31 lutego przewinęłoby się na marzec — taka data nie istnieje, odrzucamy",
  "  if (wynik.getFullYear() !== rok || wynik.getMonth() !== mies - 1",
  "      || wynik.getDate() !== dzien) return null;",
  "  return wynik;",
  "}",
  "",
  "function usunWydarzenie(kal, id) {",
  "  if (!id) return;",
  "  try {",
  "    const seria = kal.getEventSeriesById(id);",
  "    if (seria) { seria.deleteEventSeries(); return; }",
  "  } catch (err) { /* to nie seria albo juz go nie ma */ }",
  "  try {",
  "    const jedno = kal.getEventById(id);",
  "    if (jedno) jedno.deleteEvent();",
  "  } catch (err) { /* juz go nie ma — nic nie szkodzi */ }",
  "}",
  "",
  "/** Przechodzi arkusz przypomnień i doprowadza kalendarz do zgodności:",
  " *  zakłada brakujące wydarzenia, przerabia zmienione, usuwa skasowane.",
  " *  Zwraca listę ostrzeżeń — aplikacja pokaże je pod przyciskiem Połącz.",
  " *  Żaden błąd kalendarza nie przerywa całości: lecimy dalej po pozostałych. */",
  "function odswiezKalendarz() {",
  "  const ostrzezenia = [];",
  "  let kal;",
  "  try {",
  "    kal = kalendarz();",
  "  } catch (err) {",
  "    return ['nie moge otworzyc kalendarza: ' + String(err)];",
  "  }",
  "",
  "  const ark = arkusz(ARKUSZ_PRZYPOMNIEN, KOLUMNY_PRZYPOMNIEN);",
  "  const wiersze = ark.getDataRange().getValues();",
  "  const kolWydarzenie = KOLUMNY_PRZYPOMNIEN.indexOf('wydarzenieId') + 1;",
  "  const kolOdcisk = KOLUMNY_PRZYPOMNIEN.indexOf('odcisk') + 1;",
  "",
  "  for (let i = 1; i < wiersze.length; i++) {",
  "    const p = {};",
  "    KOLUMNY_PRZYPOMNIEN.forEach(function (nazwa, j) {",
  "      p[nazwa] = wiersze[i][j] == null ? '' : String(wiersze[i][j]);",
  "    });",
  "    if (!p.id) continue;",
  "",
  "    const swiezy = odciskPrzypomnienia(p);",
  "",
  "    // skasowane albo bez daty — wydarzenie ma zniknąć",
  "    if (p.usuniete || !p.data) {",
  "      if (p.wydarzenieId) {",
  "        try {",
  "          usunWydarzenie(kal, p.wydarzenieId);",
  "        } catch (err) {",
  "          ostrzezenia.push((p.tytul || p.id) + ': nie moge usunac z kalendarza');",
  "        }",
  "        ark.getRange(i + 1, kolWydarzenie).setValue('');",
  "        ark.getRange(i + 1, kolOdcisk).setValue(swiezy);",
  "      }",
  "      continue;",
  "    }",
  "",
  "    // nic się nie zmieniło i wydarzenie stoi — zostawiamy w spokoju",
  "    if (p.wydarzenieId && p.odcisk === swiezy) continue;",
  "",
  "    const start = naDateGodzine(p.data, p.godzina);",
  "    if (!start) {",
  "      ostrzezenia.push((p.tytul || p.id) + ': zla data, pomijam');",
  "      continue;",
  "    }",
  "    const koniec = new Date(start.getTime() + DLUGOSC_MINUT * 60000);",
  "",
  "    try {",
  "      if (p.wydarzenieId) usunWydarzenie(kal, p.wydarzenieId);",
  "",
  "      const opcje = { description: p.notatka || '' };",
  "      const cykl = powtarzanieNa(p.powtarzanie);",
  "      const wydarzenie = cykl",
  "        ? kal.createEventSeries(p.tytul || 'Przypomnienie', start, koniec, cykl, opcje)",
  "        : kal.createEvent(p.tytul || 'Przypomnienie', start, koniec, opcje);",
  "      wydarzenie.removeAllReminders();",
  "      const przed = parseInt(p.przedMin, 10);",
  "      wydarzenie.addPopupReminder(isNaN(przed) ? 0 : Math.max(0, przed));",
  "",
  "      ark.getRange(i + 1, kolWydarzenie).setValue(wydarzenie.getId());",
  "      ark.getRange(i + 1, kolOdcisk).setValue(swiezy);",
  "    } catch (err) {",
  "      ostrzezenia.push((p.tytul || p.id) + ': ' + String(err));",
  "    }",
  "  }",
  "",
  "  return ostrzezenia;",
  "}",
  "",
  "/* ============ do odpalenia raz, z ręki ============",
  "   Po wklejeniu tej wersji skryptu wybierz na górze funkcję \"sprawdz\" i kliknij",
  "   Wykonaj. Google zapyta o zgodę na kalendarz — zgódź się. Bez tego kroku",
  "   przypomnienia zapiszą się do arkusza, ale nic nie zadzwoni. */",
  "function sprawdz() {",
  "  const kal = kalendarz();",
  "  Logger.log('Kalendarz: ' + kal.getName() + '  (' + kal.getId() + ')');",
  "  Logger.log('Strefa arkusza: ' + SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone());",
  "  Logger.log('Strefa skryptu: ' + Session.getScriptTimeZone());",
  "  Logger.log('Zlecen w arkuszu: ' + czytaj(ARKUSZ_ZLECENIA, KOLUMNY_ZLECENIA).length);",
  "  Logger.log('Przypomnien w arkuszu: ' + czytaj(ARKUSZ_PRZYPOMNIEN, KOLUMNY_PRZYPOMNIEN).length);",
  "  Logger.log('Ostrzezenia: ' + JSON.stringify(odswiezKalendarz()));",
  "}"
].join("\n");

function trescKopii(){
  return JSON.stringify({ wersja:4, zapisano:new Date().toISOString(),
                          zlecenia:stan.zlecenia,
                          klienciWlasni:stan.klienciWlasni,
                          inne:stan.inne,
                          zamowienia:stan.zamowienia }, null, 2);
}

function wczytajKopie(){
  var wynik = document.getElementById("m-wynik");
  var tekst = document.getElementById("m-wklej").value.trim();
  if(!tekst){
    wynik.innerHTML = '<div class="komunikat">Najpierw wklej treść kopii.</div>'; return;
  }
  var dane;
  try{ dane = JSON.parse(tekst); }
  catch(e){
    wynik.innerHTML = '<div class="komunikat">To nie wygląda na plik z kopią — ' +
      "sprawdź, czy wkleiłeś całość, od pierwszego znaku do ostatniego.</div>";
    return;
  }
  var maZlecenia = dane && dane.zlecenia && typeof dane.zlecenia === "object";
  var maKlientow = dane && dane.klienciWlasni && typeof dane.klienciWlasni === "object";
  var maInne     = dane && dane.inne && typeof dane.inne === "object";
  var maZamowien = dane && dane.zamowienia && typeof dane.zamowienia === "object";
  if(!maZlecenia && !maKlientow && !maInne && !maZamowien){
    wynik.innerHTML = '<div class="komunikat">W tym pliku nie ma nic, co dałoby się wczytać.</div>';
    return;
  }

  var nowiKlienci = 0;
  if(maKlientow){
    Object.keys(dane.klienciWlasni).forEach(function(k){
      var c = dane.klienciWlasni[k];
      if(!c || !c.nazwa) return;
      var klucz = String(c.nazwa).trim().toLowerCase();
      if(!klucz || stan.klienciWlasni[klucz]) return;
      stan.klienciWlasni[klucz] = { nazwa:String(c.nazwa).trim(), km:String(c.km || "").trim() };
      nowiKlienci++;
    });
  }

  var dodane = 0, odswiezone = 0;
  Object.keys(maZlecenia ? dane.zlecenia : {}).forEach(function(id){
    var z = dane.zlecenia[id];
    if(!z || !z.data || !STATUSY[z.status]) return;
    z.id = id;
    var lokalne = stan.zlecenia[id];
    if(!lokalne){ stan.zlecenia[id] = z; stan.czekaja[id] = true; dodane++; }
    else if((z.zmieniono || "") > (lokalne.zmieniono || "")){
      stan.zlecenia[id] = z; stan.czekaja[id] = true; odswiezone++;
    }
  });
  // te same zasady dla "innych" i zamówień: nowe dopisujemy, istniejące tylko gdy świeższe
  var noweInne = 0;
  Object.keys(maInne ? dane.inne : {}).forEach(function(id){
    var i = dane.inne[id];
    if(!i || (!i.klient && !i.opis)) return;
    i.id = id;
    if(!STATUSY_INNE[i.status]) i.status = "czeka";
    var lokalne = stan.inne[id];
    if(!lokalne || (i.zmieniono || "") > (lokalne.zmieniono || "")){
      stan.inne[id] = i; stan.czekajaInne[id] = true; noweInne++;
    }
  });

  var noweZam = 0;
  Object.keys(maZamowien ? dane.zamowienia : {}).forEach(function(id){
    var z = dane.zamowienia[id];
    if(!z || !z.rzecz) return;
    z.id = id;
    if(!STATUSY_ZAM[z.status]) z.status = "doZamowienia";
    var lokalne = stan.zamowienia[id];
    if(!lokalne || (z.zmieniono || "") > (lokalne.zmieniono || "")){
      stan.zamowienia[id] = z; stan.czekajaZamowienia[id] = true; noweZam++;
    }
  });

  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
  var czesci = [dodane + " nowych zleceń", odswiezone + " odświeżonych"];
  if(nowiKlienci) czesci.push(nowiKlienci + " " +
    odmiana(nowiKlienci, "nowy klient", "nowych klientów", "nowych klientów"));
  if(noweInne) czesci.push(noweInne + " z listy „Inne”");
  if(noweZam)  czesci.push(noweZam + " z listy zamówień");
  wynik.innerHTML = '<div class="komunikat">Wczytane: ' + czesci.join(", ") + ".</div>";
}

/* ============ klikanie ============ */
function podepnijTresc(){
  var t = document.getElementById("tresc");

  t.querySelectorAll("[data-miesiac]").forEach(function(b){
    b.onclick = function(){
      var d = new Date(stan.miesiac.r, stan.miesiac.m + (+b.dataset.miesiac), 1);
      stan.miesiac = { r:d.getFullYear(), m:d.getMonth() };
      rysuj();
    };
  });
  t.querySelectorAll("[data-dzien]").forEach(function(b){
    b.onclick = function(){ stan.wybrany = b.dataset.dzien; rysuj(); };
  });
  t.querySelectorAll("[data-otworz]").forEach(function(b){
    b.onclick = function(){
      var z = stan.zlecenia[b.dataset.otworz];
      if(z) otworzFormularz(JSON.parse(JSON.stringify(z)));
    };
  });
  t.querySelectorAll("[data-termin]").forEach(function(b){
    b.onclick = function(){
      var p = stan.przypomnienia[b.dataset.termin];
      if(p) otworzTermin(JSON.parse(JSON.stringify(p)));
    };
  });
  t.querySelectorAll("[data-odpady]").forEach(function(b){
    b.onclick = function(){
      if(b.dataset.odpady === "ustaw") ustawPrzypomnieniaOdpadow();
      else usunPrzypomnieniaOdpadow();
      rysuj();
    };
  });
  t.querySelectorAll("[data-filtr]").forEach(function(b){
    b.onclick = function(){ stan.filtr = b.dataset.filtr; rysuj(); };
  });
  t.querySelectorAll("[data-inne]").forEach(function(b){
    b.onclick = function(){
      var i = stan.inne[b.dataset.inne];
      if(i) otworzInne(JSON.parse(JSON.stringify(i)));
    };
  });
  t.querySelectorAll("[data-zamowienie]").forEach(function(b){
    b.onclick = function(){
      var z = stan.zamowienia[b.dataset.zamowienie];
      if(z) otworzZamowienie(JSON.parse(JSON.stringify(z)));
    };
  });
  t.querySelectorAll("[data-firmy-przelacz]").forEach(function(b){
    b.onclick = function(){ stan.firmyOtwarte = !stan.firmyOtwarte; rysuj(); };
  });
  t.querySelectorAll("[data-firmy-zakres]").forEach(function(b){
    b.onclick = function(){ stan.firmyZakres = b.dataset.firmyZakres; rysuj(); };
  });
  t.querySelectorAll("[data-tydzien]").forEach(function(b){
    b.onclick = function(){
      stan.czasTydzien = (stan.czasTydzien === b.dataset.tydzien) ? null : b.dataset.tydzien;
      rysuj();
    };
  });
  t.querySelectorAll("[data-klient]").forEach(function(b){
    b.onclick = function(){
      stan.klientFiltr = b.dataset.klient;
      stan.filtr = "wszystkie"; stan.szukaj = ""; stan.widok = "lista";
      rysuj();
    };
  });
  t.querySelectorAll("[data-edytuj]").forEach(function(b){
    b.onclick = function(){
      otworzKlienta(b.dataset.edytuj, b.dataset.nazwa, b.dataset.km);
    };
  });
  var nowyKlient = document.getElementById("btn-nowy-klient");
  if(nowyKlient) nowyKlient.onclick = function(){ otworzKlienta("", "", ""); };

  var wyczysc = t.querySelector("[data-wyczysc-klienta]");
  if(wyczysc) wyczysc.onclick = function(){ stan.klientFiltr = null; rysuj(); };

  var pole = document.getElementById("pole-szukaj");
  if(pole){
    pole.oninput = function(){
      var poz = pole.selectionStart;
      stan.szukaj = pole.value;
      rysuj();
      var nowe = document.getElementById("pole-szukaj");
      if(nowe){ nowe.focus(); try{ nowe.setSelectionRange(poz, poz); }catch(e){} }
    };
  }
}

function podepnijFormularz(){
  document.getElementById("f-anuluj").onclick = zamknijFormularz;
  document.getElementById("zaslona").onclick = function(e){
    if(e.target.id === "zaslona") zamknijFormularz();
  };
  // godziny od-do same wyliczają, ile to wyszło — można potem poprawić ręcznie
  function przeliczCzas(){
    var od = document.getElementById("f-od").value;
    var doKiedy = document.getElementById("f-do").value;
    if(!od || !doKiedy) return;
    var g = godzinyMiedzy(od, doKiedy);
    if(g != null) document.getElementById("f-czas").value = liczba(g);
  }
  document.getElementById("f-od").onchange = przeliczCzas;
  document.getElementById("f-do").onchange = przeliczCzas;

  // ptaszek „Przypomnij mi o tym" odkrywa datę, godzinę i dzwonek
  var wlPrzyp = document.getElementById("f-przyp-wl");
  if(wlPrzyp){
    wlPrzyp.onchange = function(){
      var szczegoly = document.getElementById("f-przyp-szczegoly");
      if(szczegoly) szczegoly.hidden = !wlPrzyp.checked;
    };
  }

  // po wpisaniu klienta podstaw trasę z ostatniej u niego wizyty
  var poleKlient = document.getElementById("f-klient");
  poleKlient.onchange = function(){
    var poleKm = document.getElementById("f-km");
    if(!poleKm || poleKm.value.trim()) return;
    var km = ostatnieKm(poleKlient.value);
    if(km) poleKm.value = km;
  };
  document.getElementById("f-statusy").querySelectorAll("[data-status]").forEach(function(b){
    b.onclick = function(){
      zbierzZFormularza();
      stan.formularz.status = b.dataset.status;
      rysujFormularz();
    };
  });
  var usun = document.getElementById("f-usun");
  if(usun) usun.onclick = function(){
    if(usun.dataset.pewny){ usunZlecenie(stan.formularz.id); zamknijFormularz(); return; }
    usun.dataset.pewny = "1";
    usun.textContent = "Na pewno usunąć?";
  };
  document.getElementById("f-zapisz").onclick = function(){
    var z = zbierzZFormularza();
    if(!z.klient && !z.opis){
      document.getElementById("f-wynik").innerHTML =
        '<div class="komunikat">Wpisz przynajmniej klienta albo to, co robiłeś.</div>';
      document.getElementById("f-klient").focus();
      return;
    }
    if(z.zPomiaru){ delete z.zPomiaru; stan.pomiar = null; }
    zapiszPrzypomnienieZFormularza(z);   // przed zapisem zlecenia: tytuł bierze z jego treści
    zapiszZlecenie(z);                   // to ono zapisuje na dysk i wysyła całość
    stan.wybrany = z.data;
    var d = zKlucza(z.data);
    stan.miesiac = { r:d.getFullYear(), m:d.getMonth() };
    zamknijFormularz();
  };
}

function podepnijMenu(){
  var zamknij = function(){ document.getElementById("warstwa").innerHTML = ""; };
  document.getElementById("m-zamknij").onclick = zamknij;
  document.getElementById("zaslona").onclick = function(e){
    if(e.target.id === "zaslona") zamknij();
  };
  document.getElementById("m-pobierz").onclick = pobierzKopie;
  document.getElementById("m-kopiuj").onclick = pokazKopieDoSkopiowania;
  document.getElementById("m-skrypt-plik").onclick = pobierzSkryptArkusza;
  document.getElementById("m-skrypt-schowek").onclick = skryptDoSchowka;
  document.getElementById("m-wczytaj").onclick = wczytajKopie;
  document.getElementById("m-pdf-miesiac").onclick  = function(){ drukujZestawienie("miesiac"); };
  document.getElementById("m-pdf-wszystko").onclick = function(){ drukujZestawienie("wszystko"); };
  document.getElementById("m-txt-miesiac").onclick  = function(){ tekstDoWiadomosci("miesiac"); };
  document.getElementById("m-txt-wszystko").onclick = function(){ tekstDoWiadomosci("wszystko"); };
  document.getElementById("m-xls-miesiac").onclick  = function(){ pobierzExcel("miesiac"); };
  document.getElementById("m-xls-wszystko").onclick = function(){ pobierzExcel("wszystko"); };
  document.getElementById("m-inne-txt").onclick = function(){
    pokazTekst(tekstInne(), "inne-zlecenia");
  };
  document.getElementById("m-zam-txt").onclick = function(){
    pokazTekst(tekstZamowien(), "do-zamowienia");
  };
  document.getElementById("m-inne-pdf").onclick = function(){
    drukujHtml(zestawienieInneHtml(), "inne-zlecenia");
  };
  document.getElementById("m-inne-xls").onclick = function(){
    pobierzPlik("inne-zlecenia.csv", csvInne(), "text/csv;charset=utf-8");
  };
  document.getElementById("m-zam-pdf").onclick = function(){
    drukujHtml(zestawienieZamowienHtml(), "do-zamowienia");
  };
  document.getElementById("m-zam-xls").onclick = function(){
    pobierzPlik("do-zamowienia.csv", csvZamowien(), "text/csv;charset=utf-8");
  };

  var wklejAdres = document.getElementById("m-wklej-adres");
  if(wklejAdres) wklejAdres.onclick = function(){
    var stanEl = document.getElementById("m-stan");
    if(!navigator.clipboard || !navigator.clipboard.readText){
      stanEl.innerHTML = '<div class="komunikat">Ta przeglądarka nie daje mi dostępu do ' +
        "schowka. Przytrzymaj palec na polu wyżej i wybierz Wklej.</div>";
      return;
    }
    navigator.clipboard.readText().then(function(t){
      document.getElementById("m-adres").value = String(t || "").replace(/\s+/g, "");
      stanEl.innerHTML = '<div class="komunikat">Wklejone. Naciśnij Połącz.</div>';
    }).catch(function(){
      stanEl.innerHTML = '<div class="komunikat">Telefon nie pozwolił mi zajrzeć do schowka. ' +
        "Przytrzymaj palec na polu wyżej i wybierz Wklej.</div>";
    });
  };

  document.getElementById("m-polacz").onclick = function(){
    var stanEl = document.getElementById("m-stan");
    // czyścimy to, co dokleja poczta i klawiatura: spacje, złamania linii, kropkę na końcu
    var a = document.getElementById("m-adres").value.replace(/\s+/g, "");
    a = a.replace(/[.,;)]+$/, "");
    if(a && a.indexOf("http") !== 0) a = "https://" + a;
    while(a.slice(-1) === "/") a = a.slice(0, -1);
    if(!a){
      stanEl.innerHTML = '<div class="komunikat">Najpierw wklej adres.</div>';
      return;
    }
    document.getElementById("m-adres").value = a;
    ustawAdres(a);
    Object.keys(stan.zlecenia).forEach(function(id){ stan.czekaja[id] = true; });
    Object.keys(stan.klienciWlasni).forEach(function(k){ stan.czekajaKlienci[k] = true; });
    Object.keys(stan.przypomnienia).forEach(function(id){ stan.czekajaPrzyp[id] = true; });
    zapiszLokalnie();
    stanEl.innerHTML = '<div class="komunikat">Wysyłam…</div>';
    synchronizuj().then(function(udane){
      // arkusz mógł przyjąć zapis, a odbić się na kalendarzu — o tym trzeba powiedzieć
      var oKalendarzu = ostrzezeniaSync.length
        ? '<div class="komunikat">Zapisane w arkuszu, ale <b>kalendarz zgłasza problem</b>:<br>' +
          ostrzezeniaSync.map(esc).join("<br>") +
          "<br>Najczęściej brakuje zgody na kalendarz — w Apps Script uruchom raz " +
          "z ręki funkcję <b>sprawdz</b>.</div>"
        : "";
      stanEl.innerHTML = udane
        ? '<div class="komunikat">Połączone. W arkuszu jest ' + wszystkie().length + " " +
          odmiana(wszystkie().length, "zlecenie", "zlecenia", "zleceń") + " i " +
          klienci().length + " " + odmiana(klienci().length, "klient", "klienci", "klientów") +
          ".</div>" + oKalendarzu
        : '<div class="komunikat">Nie udało się: ' + esc(bladSync) + ".<br>" +
          (a.toLowerCase().indexOf("script.google.com/macros/") === -1
            ? "Ten adres nie wygląda na skrypt Google — powinien zawierać " +
              "<b>script.google.com/macros/s/</b> i kończyć się na <b>/exec</b>. " +
              "Sprawdź, czy poczta nie ucięła go w pół."
            : "Adres wygląda dobrze, więc sprawdź wdrożenie skryptu: dostęp musi być " +
              "ustawiony na <b>Każdy</b>.") + "</div>";
    });
  };
  var rozlacz = document.getElementById("m-rozlacz");
  if(rozlacz) rozlacz.onclick = function(){
    ustawAdres("");
    pokazSync();
    otworzMenu();
  };
}

/* ============ start ============ */
function start(zapamietane){
  zapamietane = zapamietane || {};
  wczytajLokalnie();
  try{ localStorage.removeItem("zlecenia.zdjecie"); }catch(e){}
  var d = new Date();
  stan.miesiac = zapamietane.miesiac || { r:d.getFullYear(), m:d.getMonth() };
  stan.wybrany = zapamietane.wybrany || dzisiaj();
  stan.widok   = zapamietane.widok   || "kalendarz";
  stan.filtr   = zapamietane.filtr   || "wszystkie";
  stan.szukaj  = zapamietane.szukaj  || "";

  document.getElementById("btn-dodaj").onclick = function(){
    if(stan.widok === "inne") otworzInne(null);
    else if(stan.widok === "zamowienia") otworzZamowienie(null);
    else if(stan.widok === "terminy") otworzTermin(null);
    else otworzFormularz(null);
  };
  document.getElementById("btn-menu").onclick = otworzMenu;
  document.getElementById("btn-qr").onclick = otworzKodQr;
  document.getElementById("zakladki").onclick = function(e){
    var b = e.target.closest("[data-zakladka]");
    if(!b) return;
    stan.widok = b.dataset.zakladka;
    if(stan.widok !== "lista") stan.klientFiltr = null;
    rysuj();
  };
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape" || !document.getElementById("zaslona")) return;
    if(stan.formularz) zamknijFormularz();
    else { stan.klientForm = null; document.getElementById("warstwa").innerHTML = ""; rysuj(); }
  });

  rysuj();
  if(zapamietane.formularz) otworzFormularz(zapamietane.formularz);
  podlaczBaze();
}

var hot = window.claude && window.claude.hot;
if(hot && hot.snapshot){
  hot.snapshot(function(){
    return { widok:stan.widok, miesiac:stan.miesiac, wybrany:stan.wybrany,
             filtr:stan.filtr, szukaj:stan.szukaj,
             formularz:stan.formularz ? zbierzZFormularza() : null };
  });
}
if(hot && hot.ready) hot.ready(start);
else start(hot && hot.data);

/* tryb offline — aplikacja ma ruszać w serwerowni bez zasięgu */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* trudno, działa i bez tego */ });
  });
}

})();
