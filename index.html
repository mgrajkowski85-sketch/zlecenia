<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dziennik zleceń</title>
<meta name="description" content="Kalendarz zleceń serwisowych — co robiłeś, u kogo i co zostało do dokończenia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona-192.png">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zlecenia">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: light dark;
  --tlo:#f4f6f8;      --karta:#ffffff;    --karta2:#f9fafb;
  --tekst:#1b1f24;    --slaby:#68717d;    --linia:#e1e5ea;
  --akcent:#1d4ed8;   --akcent-tlo:#e9eefc;
  --zrob:#d5f2dd;     --zrob-t:#14532d;   --zrob-k:#2f9e5e;
  --tok:#ffe9c7;      --tok-t:#7c2d12;    --tok-k:#d97706;
  --plan:#d8e6ff;     --plan-t:#1e3a8a;   --plan-k:#3b82f6;
  --wolne:#eef0f3;    --blad:#b91c1c;   --blad-tlo:#fde8e8;
  --cien:0 1px 2px rgba(16,24,40,.06), 0 2px 6px rgba(16,24,40,.05);
  --naglowek:"Archivo","Segoe UI",system-ui,sans-serif;
  --tresc:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tlo:#131619;     --karta:#1b1f24;   --karta2:#20252b;
    --tekst:#e7eaee;   --slaby:#98a1ac;   --linia:#2d333b;
    --akcent:#6b9bff;  --akcent-tlo:#1d2740;
    --zrob:#1c4030;    --zrob-t:#a7e8c0;  --zrob-k:#3fbb78;
    --tok:#452f14;     --tok-t:#ffd9a3;   --tok-k:#e09b34;
    --plan:#1b3564;    --plan-t:#b7cdff;  --plan-k:#5b8cf0;
    --wolne:#23282e;   --blad:#f87171;   --blad-tlo:#3b1d1d;
    --cien:0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --tlo:#131619;     --karta:#1b1f24;   --karta2:#20252b;
  --tekst:#e7eaee;   --slaby:#98a1ac;   --linia:#2d333b;
  --akcent:#6b9bff;  --akcent-tlo:#1d2740;
  --zrob:#1c4030;    --zrob-t:#a7e8c0;  --zrob-k:#3fbb78;
  --tok:#452f14;     --tok-t:#ffd9a3;   --tok-k:#e09b34;
  --plan:#1b3564;    --plan-t:#b7cdff;  --plan-k:#5b8cf0;
  --wolne:#23282e;   --blad:#f87171;   --blad-tlo:#3b1d1d;
  --cien:0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{margin:0;background:var(--tlo);color:var(--tekst);
     font:15px/1.45 var(--tresc);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--akcent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.aplikacja{max-width:560px;margin:0 auto;min-height:100vh;
           display:flex;flex-direction:column;background:var(--tlo)}

/* ---------- gorny pasek ---------- */
.gora-blok{position:sticky;top:0;z-index:20;background:var(--karta);
           border-bottom:1px solid var(--linia)}
.gora{padding:10px 16px;display:flex;align-items:center;gap:10px}

/* ---------- stoper ---------- */
.pomiar{padding:8px 16px 10px;display:flex;align-items:center;gap:10px;
        border-top:1px solid var(--linia)}
.pomiar.dziala{background:var(--tok)}
.pomiar.zmierzony{background:var(--plan)}
.p-start{flex:1;padding:10px;border-radius:10px;border:1px dashed var(--linia);
         color:var(--slaby);font-weight:600;font-size:13.5px;
         display:flex;align-items:center;justify-content:center;gap:8px}
.p-start:hover{border-style:solid;border-color:var(--akcent);color:var(--akcent)}
.p-kropka{width:9px;height:9px;border-radius:50%;background:var(--tok-k);flex:none;
          animation:tetno 1.6s ease-in-out infinite}
@keyframes tetno{0%,100%{opacity:1}50%{opacity:.25}}
.p-zegar{font-family:var(--naglowek);font-size:19px;font-weight:700;
         font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--tok-t)}
.pomiar.zmierzony .p-zegar{color:var(--plan-t)}
.p-opis{flex:1;font-size:12px;color:var(--tok-t);opacity:.85;line-height:1.3}
.pomiar.zmierzony .p-opis{color:var(--plan-t)}
.p-akcja{padding:9px 14px;border-radius:9px;font-weight:700;font-size:13px;
         font-family:var(--naglowek);background:var(--akcent);color:#fff;flex:none}
.p-akcja:hover{filter:brightness(1.08)}
.p-drobny{padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;flex:none;
          color:var(--tok-t);border:1px solid rgba(0,0,0,.14);background:transparent}
.pomiar.zmierzony .p-drobny{color:var(--plan-t)}
.marka{font-family:var(--naglowek);font-weight:700;font-size:17px;
       letter-spacing:-.015em;margin:0}
.stan-sync{margin-left:auto;display:flex;align-items:center;gap:6px;
           font-size:11px;color:var(--slaby);letter-spacing:.03em;text-transform:uppercase}
.kropka{width:8px;height:8px;border-radius:50%;background:var(--slaby);flex:none}
.kropka.ok{background:var(--zrob-k)}
.kropka.czeka{background:var(--tok-k)}
.kropka.brak{background:var(--slaby)}
.kropka.blad{background:var(--blad)}
.menu-btn{padding:6px 8px;font-size:18px;line-height:1;color:var(--slaby);border-radius:8px;
          display:flex;align-items:center}
.menu-btn:hover{background:var(--karta2);color:var(--akcent)}

/* ---------- kod QR ---------- */
.qr-pole{margin:6px auto 0;padding:16px;background:#fff;border-radius:14px;
         width:max-content;max-width:100%;min-height:292px;display:grid;place-items:center}
.qr-pole img,.qr-pole canvas{display:block;max-width:100%;height:auto}
.qr-adres{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--karta2);
          border:1px solid var(--linia);font-size:11px;line-height:1.5;color:var(--slaby);
          word-break:break-all;user-select:all;-webkit-user-select:all}

/* ---------- tresc ---------- */
.tresc{flex:1;padding:0 16px 96px}
.pusto{text-align:center;padding:52px 8px;color:var(--slaby)}
.pusto .duze{font-family:var(--naglowek);font-size:17px;font-weight:600;
             color:var(--tekst);margin-bottom:6px}
.pusto p{margin:0 auto;max-width:34ch;font-size:14px}

/* ---------- kalendarz ---------- */
.miesiac{display:flex;align-items:center;gap:4px;padding:14px 0 10px}
.miesiac b{flex:1;text-align:center;font-family:var(--naglowek);
           font-weight:600;font-size:16px;letter-spacing:-.01em}
.strzalka{width:38px;height:38px;border-radius:10px;font-size:19px;
          color:var(--slaby);display:grid;place-items:center}
.strzalka:hover{background:var(--karta2);color:var(--tekst)}

.siatka{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:10px;font-weight:600;color:var(--slaby);
     text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.dzien{aspect-ratio:1/1;min-height:44px;max-width:100%;border-radius:10px;
       background:var(--karta);border:1px solid var(--linia);display:flex;
       flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
       padding:5px 2px 4px;font-variant-numeric:tabular-nums;font-size:14px}
.dzien.obcy{background:transparent;border-color:transparent}
.dzien.weekend{background:var(--wolne)}
.dzien.dzis{border-color:var(--akcent);font-weight:700}
.dzien.wybrany{background:var(--akcent);border-color:var(--akcent);color:#fff;font-weight:700}
.paski{display:flex;gap:2px;height:5px;align-items:center}
.paski i{width:5px;height:5px;border-radius:50%;display:block}
.i-zrobione{background:var(--zrob-k)}
.i-wtoku{background:var(--tok-k)}
.i-planowane{background:var(--plan-k)}

.podsumowanie{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--karta);
              border:1px solid var(--linia);display:flex;flex-wrap:wrap;
              justify-content:center;gap:4px 14px;font-size:12.5px;color:var(--slaby)}
.podsumowanie b{color:var(--tekst);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- czas wg firm ---------- */
.firmy{margin-top:8px;border:1px solid var(--linia);border-radius:10px;
       background:var(--karta);overflow:hidden}
.firmy-gora{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;
            font-size:12.5px;color:var(--tekst);font-weight:600;text-align:left}
.firmy-gora .ile{margin-left:auto;color:var(--slaby);font-weight:600;font-size:12px}
.firmy-gora .strzal{color:var(--slaby);font-size:11px;transition:transform .15s}
.firmy[data-otwarte="1"] .firmy-gora .strzal{transform:rotate(90deg)}
.firmy-tresc{border-top:1px solid var(--linia);padding:4px 12px 10px}
.firmy-zakres{display:flex;gap:6px;padding:8px 0 6px}
.firmy-zakres button{flex:1;padding:6px 0;border-radius:8px;font-size:12px;font-weight:600;
                     color:var(--slaby);background:var(--karta2);border:1px solid var(--linia)}
.firmy-zakres button[aria-pressed="true"]{color:var(--akcent);background:var(--akcent-tlo);
                     border-color:var(--akcent)}
.firmy-wiersz{display:flex;align-items:baseline;gap:8px;padding:6px 0;
              border-top:1px solid var(--linia);font-size:13px}
.firmy-wiersz:first-of-type{border-top:none}
.firmy-wiersz .nazwa{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.firmy-wiersz .drobne{color:var(--slaby);font-size:11.5px;white-space:nowrap}
.firmy-wiersz .godz{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.firmy-suma{display:flex;gap:8px;padding:9px 0 2px;margin-top:4px;
            border-top:2px solid var(--linia);font-size:13px;font-weight:700}
.firmy-suma .nazwa{flex:1}
.firmy-suma .godz{font-variant-numeric:tabular-nums}
.firmy-pusto{padding:10px 0 6px;font-size:12.5px;color:var(--slaby)}

.naglowek-dnia{display:flex;align-items:baseline;gap:8px;padding:20px 2px 8px}
.naglowek-dnia h2{font-family:var(--naglowek);font-size:15px;font-weight:600;
                  margin:0;letter-spacing:-.01em}
.naglowek-dnia span{font-size:12px;color:var(--slaby);margin-left:auto;flex:none}

/* ---------- lista zlecen ---------- */
.lista{background:var(--karta);border:1px solid var(--linia);border-radius:12px;
       overflow:hidden;box-shadow:var(--cien)}
.wpis{display:flex;gap:11px;padding:11px 12px 11px 0;width:100%;text-align:left;
      border-bottom:1px solid var(--linia);align-items:stretch}
.wpis:last-child{border-bottom:none}
.wpis:hover{background:var(--karta2)}
.pasek-statusu{width:4px;flex:none;border-radius:0 3px 3px 0;min-height:36px}
.s-zrobione{background:var(--zrob-k)}
.s-wtoku{background:var(--tok-k)}
.s-planowane{background:var(--plan-k)}
.wpis-tresc{flex:1;min-width:0;display:block}
.wpis-klient{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.wpis-opis{display:block;color:var(--slaby);font-size:13.5px;line-height:1.4;margin-top:2px;
           overflow-wrap:anywhere;white-space:pre-wrap}
.wpis-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.plakietka{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;
           letter-spacing:.02em;white-space:nowrap}
.p-zrobione{background:var(--zrob);color:var(--zrob-t)}
.p-wtoku{background:var(--tok);color:var(--tok-t)}
.p-planowane{background:var(--plan);color:var(--plan-t)}
.meta-tekst{font-size:11.5px;color:var(--slaby);font-variant-numeric:tabular-nums}
.znacznik{font-size:11px;color:var(--tok-t);background:var(--tok);
          padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}

/* ---------- przypomnienia „na następny raz" ---------- */
.znacznik.dzwonek{color:var(--plan-t);background:var(--plan)}
.znacznik.dzwonek.minelo{color:#fff;background:var(--blad)}

.pole.przypomnienie{border:1px solid var(--linia);border-radius:12px;
                    padding:12px;background:var(--karta2)}
.ptaszek{display:flex;align-items:center;gap:10px;cursor:pointer;
         font-size:14px;font-weight:600;color:var(--tekst);
         text-transform:none;letter-spacing:normal;margin:0}
.ptaszek input{width:20px;height:20px;flex:none;accent-color:var(--akcent);margin:0}
.przyp-szczegoly{margin-top:12px}
.przyp-szczegoly[hidden]{display:none}
.przyp-szczegoly .pole:last-of-type{margin-bottom:0}
.objasnienie-przyp{margin:8px 0 0;font-size:11.5px;line-height:1.45;color:var(--slaby)}

.zalegle-blok{margin:10px 0 4px;border:1px solid var(--blad);border-radius:12px;
              background:var(--karta);overflow:hidden}
.zalegle-naglowek{padding:9px 12px;background:var(--blad);color:#fff;
                  font-family:var(--naglowek);font-size:12.5px;font-weight:700}
.zalegly{width:100%;display:flex;align-items:baseline;gap:10px;padding:10px 12px;
         text-align:left;border-top:1px solid var(--linia);background:var(--karta)}
.zalegle-blok .zalegly:first-of-type{border-top:none}
.zalegly:hover{background:var(--karta2)}
.zalegly-kiedy{flex:none;font-size:12px;font-weight:700;color:var(--blad);
               font-variant-numeric:tabular-nums}
.zalegly-tresc{flex:1;min-width:0;font-size:13.5px;color:var(--tekst);word-break:break-word}

/* ---------- zakladka Terminy (drugi kalendarz) ---------- */
.znacznik.cykl{color:var(--plan-t);background:var(--plan)}
.i-termin{background:var(--akcent)}
.i-cykl{background:var(--plan-k)}
.dzien.wybrany .paski i{background:#fff}
.pasek-statusu.s-termin{background:var(--akcent)}
.pasek-statusu.s-cykl{background:var(--plan-k)}
.grupa-data.pilna{color:var(--blad)}
/* .wpis ma tylko dolna krawedz, wiec zalegly znaczymy tlem i paskiem, nie ramka */
.wpis.pilny{background:var(--blad-tlo)}
.wpis.pilny .pasek-statusu{background:var(--blad)}
.wpis.pilny .wpis-opis{color:var(--blad);font-weight:600}

/* ---------- zakladka Odpady ---------- */
/* osiem zakladek na waskim telefonie — scieniamy etykiety, zeby sie nie lamaly */
@media (max-width:420px){
  .zakladka{font-size:9px;padding-left:1px;padding-right:1px;gap:2px}
  .zakladka svg{width:18px;height:18px}
}

.odp-karta{margin:12px 0 0;padding:14px;border-radius:14px;border:2px solid var(--linia);
           background:var(--karta);box-shadow:var(--cien)}
.odp-karta.odp-pelny{border-color:#d62828;background:rgba(214,40,40,.07)}
.odp-karta.odp-zmieszane{border-color:#e6b800;background:rgba(230,184,0,.1)}
.odp-karta.odp-pszok{border-color:#3b82f6;background:rgba(59,130,246,.08)}
.odp-kiedy{font-family:var(--naglowek);font-size:12px;font-weight:700;
           text-transform:uppercase;letter-spacing:.06em;color:var(--slaby)}
.odp-data{font-family:var(--naglowek);font-size:19px;font-weight:700;
          letter-spacing:-.015em;margin:2px 0 6px}
.odp-co{font-size:15px;font-weight:700}
.odp-worki{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.odp-worki.male{margin-top:5px}
.worek{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
       border:1px solid rgba(0,0,0,.18);white-space:nowrap}
.worek.w-czarny{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.worek.w-zolty{background:#ffd60a;color:#4a3b00}
.worek.w-niebieski{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
.worek.w-zielony{background:#2f9e5e;color:#fff;border-color:#2f9e5e}
.worek.w-brazowy{background:#8a5a2b;color:#fff;border-color:#8a5a2b}
.odp-uwaga{margin-top:9px;font-size:12.5px;line-height:1.45;font-weight:600;color:var(--blad)}
.odp-przed7{margin-top:9px;padding-top:9px;border-top:1px solid var(--linia);
            font-size:12.5px;color:var(--slaby)}

.odp-akcja{margin:12px 0 4px;display:flex;flex-direction:column;gap:7px}
.odp-akcja .glowny,.odp-akcja .wtorny{width:100%}
.odp-stan{font-size:12px;color:var(--slaby);line-height:1.4;text-align:center}

.odp-wiersz{padding-right:12px}
.odp-pasek-pelny{background:#d62828}
.odp-pasek-zmieszane{background:#e6b800}
.odp-pasek-pszok{background:#3b82f6}

.odp-legenda{display:flex;flex-direction:column;gap:7px}
.odp-leg{padding:9px 11px;border-radius:10px;background:var(--karta);
         border:1px solid var(--linia);border-left-width:5px;font-size:12.5px;
         line-height:1.45;color:var(--slaby)}
.odp-leg b{color:var(--tekst)}
.odp-leg.odp-pasek-pelny{background:var(--karta);border-left-color:#d62828}
.odp-leg.odp-pasek-zmieszane{background:var(--karta);border-left-color:#e6b800}
.odp-leg.odp-pasek-pszok{background:var(--karta);border-left-color:#3b82f6}
.odp-leg-uwaga{display:block;margin-top:4px;font-weight:600;color:var(--blad)}

.odp-zdjecie{display:block;border:1px solid var(--linia);border-radius:12px;
             overflow:hidden;background:#fff}
.odp-zdjecie img{display:block;width:100%;height:auto}
.odp-zrodlo{margin:7px 0 0;font-size:11.5px;line-height:1.45;color:var(--slaby)}
.grupa-data{font-family:var(--naglowek);font-size:12px;font-weight:600;color:var(--slaby);
            text-transform:uppercase;letter-spacing:.06em;padding:18px 2px 7px}

/* ---------- filtry / szukanie ---------- */
.filtry{display:flex;gap:6px;padding:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.filtry::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linia);background:var(--karta);border-radius:20px;
      padding:6px 13px;font-size:13px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--akcent);border-color:var(--akcent);
      color:#fff;font-weight:600}
.szukaj{width:100%;margin-top:10px;padding:10px 13px;border-radius:10px;
        border:1px solid var(--linia);background:var(--karta)}

/* ---------- klienci ---------- */
.klient-wiersz{display:flex;align-items:stretch;width:100%;
               border-bottom:1px solid var(--linia)}
.klient-wiersz:last-child{border-bottom:none}
.klient-glowny{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;
               padding:13px 4px 13px 14px}
.klient-glowny:hover{background:var(--karta2)}
.klient-edytuj{padding:0 15px;color:var(--slaby);font-size:15px;flex:none}
.klient-edytuj:hover{color:var(--akcent);background:var(--karta2)}
.dodaj-klienta{width:100%;margin-top:12px;padding:11px;border-radius:10px;
               border:1px dashed var(--linia);color:var(--slaby);font-weight:600;font-size:13.5px}
.dodaj-klienta:hover{border-style:solid;border-color:var(--akcent);color:var(--akcent)}
.bez-zlecen{font-style:italic}
.inicjal{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
         background:var(--akcent-tlo);color:var(--akcent);font-family:var(--naglowek);
         font-weight:700;font-size:14px}
.klient-dane{min-width:0;flex:1}
.klient-nazwa{display:block;font-weight:600;overflow-wrap:anywhere}
.klient-pod{display:block;font-size:12px;color:var(--slaby);margin-top:1px;
            font-variant-numeric:tabular-nums}
.klient-licznik{font-size:13px;color:var(--slaby);font-variant-numeric:tabular-nums;flex:none}

/* ---------- zakladka Czas pracy ---------- */

            background:var(--karta);overflow:hidden;box-shadow:var(--cien)}

            font-variant-numeric:tabular-nums;white-space:nowrap}
.cz-drobne{display:block;font-size:11.5px;color:var(--slaby);margin-top:2px}
.cz-pasek{display:block;height:6px;border-radius:3px;background:var(--wolne);margin:9px 0 8px}
.cz-pasek i{display:block;height:100%;border-radius:3px;background:var(--akcent);min-width:3px}

.cz-dow{display:block;font-size:9.5px;font-weight:600;color:var(--slaby);
        text-transform:uppercase;letter-spacing:.04em}
.cz-ile{display:block;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cz-szczegoly{border-top:1px solid var(--linia);padding:0 10px 12px}
.cz-szczegoly .grupa-data{padding:12px 2px 6px}
.cz-suma{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--karta);
         border:1px solid var(--linia)}
.cz-suma-wiersz{display:flex;align-items:baseline;gap:10px;font-size:13.5px;
                font-weight:600;padding:3px 0}
.cz-suma-wiersz b{margin-left:auto;font-variant-numeric:tabular-nums}
.cz-suma-wiersz.drobny{font-size:12px;font-weight:500;color:var(--slaby)}
.cz-uwaga{margin-top:8px;padding:0 2px;font-size:11.5px;line-height:1.45;color:var(--slaby)}

/* ---------- dolny pasek ---------- */
.dol{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--karta);
     border-top:1px solid var(--linia);padding-bottom:env(safe-area-inset-bottom)}
.dol-wnetrze{max-width:560px;margin:0 auto;display:flex;width:100%}
.zakladka{flex:1;min-width:0;padding:9px 4px 10px;display:flex;flex-direction:column;
          align-items:center;gap:3px;color:var(--slaby);font-size:11px;font-weight:600}
.zakladka svg{width:21px;height:21px;stroke:currentColor;fill:none;
              stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* na waskim ekranie etykieta ma sie przyciac, a nie wylezc poza zakladke */
.zakladka span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zakladka[aria-current="page"]{color:var(--akcent)}
.dodaj{position:fixed;right:max(16px,calc(50vw - 264px));
       bottom:calc(74px + env(safe-area-inset-bottom));
       z-index:21;width:54px;height:54px;border-radius:17px;background:var(--akcent);
       color:#fff;font-size:27px;line-height:1;display:grid;place-items:center;
       box-shadow:0 4px 14px rgba(29,78,216,.34)}
.dodaj:hover{filter:brightness(1.08)}
.dodaj[hidden]{display:none}    /* bez tego display:grid bije domyslne [hidden] */

/* ---------- zdjecia ---------- */
.zdj-lista{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

           border:1px solid var(--linia);background:var(--karta2) center/cover no-repeat;
           display:grid;place-items:center;color:var(--slaby);font-size:12px}
.zdj-kafel .zdj-czeka{position:absolute;left:4px;bottom:4px;padding:1px 5px;border-radius:6px;
                      background:var(--tok);color:var(--tok-t);font-size:9.5px;font-weight:700}
.zdj-pusto{font-size:12.5px;color:var(--slaby);padding:2px 0 4px}
.zdj-tlo{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.94);
         display:flex;flex-direction:column}
.zdj-pasek{display:flex;gap:8px;padding:10px 12px calc(10px);justify-content:space-between}
.zdj-btn{padding:8px 14px;border-radius:9px;background:rgba(255,255,255,.14);color:#eef2f7;
         font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.2)}
.zdj-btn.groznie{background:rgba(185,28,28,.28);border-color:rgba(248,113,113,.5)}
.zdj-srodek{flex:1;display:grid;place-items:center;padding:0 10px
            calc(12px + env(safe-area-inset-bottom));color:#c8cdd4;font-size:13px;overflow:auto}
.zdj-srodek img{max-width:100%;max-height:100%;border-radius:8px}

.podglad-tekstu{width:100%;min-height:150px;margin-top:8px;padding:8px 10px;
                border:1px solid var(--linia);border-radius:8px;background:var(--karta2);
                color:var(--tekst);font:12.5px/1.5 ui-monospace,Consolas,monospace;
                white-space:pre;resize:vertical}

/* ---------- zestawienie do druku (PDF) ----------
   Na ekranie schowane. Przy drukowaniu chowamy aplikację i pokazujemy tabelę.
   Zapis do PDF robi samo okno drukowania — nie potrzeba żadnej biblioteki. */
#wydruk{display:none}
@media print{
  .aplikacja, #warstwa{display:none !important}
  #wydruk{display:block !important;color:#000;
          font:12px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}

  #wydruk thead{display:table-header-group}
  #wydruk tr{break-inside:avoid}
  #wydruk th,#wydruk td{border:1px solid #8a8a8a;padding:4px 6px;
                        text-align:left;vertical-align:top}
  #wydruk th{background:#ececec;font-size:10px;text-transform:uppercase;letter-spacing:.04em}

  #wydruk td.wy-godz{white-space:nowrap}
  #wydruk .wy-suma{margin-top:12px;font-size:12.5px;font-weight:700}
  #wydruk .wy-naglowek2{font-size:14px;margin:20px 0 6px;break-after:avoid}
  #wydruk tr.wy-razem td{font-weight:700;background:#f4f4f4}
  #wydruk .wy-stopka{margin-top:16px;font-size:10px;color:#666}

}
@page{size:A4;margin:14mm}

         display:flex;align-items:flex-end;justify-content:center}

        border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}

             position:sticky;top:-16px;background:var(--karta);padding:4px 0 10px;z-index:2}

                letter-spacing:-.015em}

.zamknij:hover{background:var(--karta2)}

                background:var(--karta2);font-size:13px;font-weight:600}
.statusy button[aria-pressed="true"].w-planowane{background:var(--plan);color:var(--plan-t);
                border-color:var(--plan-k)}
.statusy button[aria-pressed="true"].w-wtoku{background:var(--tok);color:var(--tok-t);
                border-color:var(--tok-k)}
.statusy button[aria-pressed="true"].w-zrobione{background:var(--zrob);color:var(--zrob-t);
                border-color:var(--zrob-k)}
.przyciski{display:flex;gap:8px;margin-top:20px;align-items:center}
.glowny{flex:1;padding:13px;border-radius:11px;background:var(--akcent);color:#fff;
        font-weight:700;font-family:var(--naglowek);font-size:15px}
.glowny:hover{filter:brightness(1.08)}
.wtorny{padding:13px 16px;border-radius:11px;border:1px solid var(--linia);
        background:var(--karta2);font-weight:600;font-size:14px}
.usun{color:var(--blad)}
.podpowiedz{font-size:12px;color:var(--slaby);margin-top:10px;line-height:1.5}
.komunikat{padding:10px 12px;border-radius:10px;background:var(--tok);color:var(--tok-t);
           font-size:13px;font-weight:600;margin-top:12px;line-height:1.45}
.rzad{display:flex;gap:10px}
.rzad .pole{flex:1}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<div class="aplikacja">
  <div class="gora-blok">

        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">

<script>

var stan = {

  czekaja: {},         // id -> true, zmiany jeszcze niewysłane na serwer

  usunieteZamowienia: {},
  czekajaZamowienia: {},

  terminForm: null,      // otwarty formularz terminu wlasnego (zakladka Terminy)

  usunieteZdjecia: {},
  czekajaZdjecia: {},

  // id = "p-" + id zlecenia. Zeby telefon zadzwonil, skrypt arkusza wpisuje
  // taki termin do Kalendarza Google — przegladarka sama tego nie potrafi.
  // "wydarzenieId" i "odcisk" nadaje skrypt, my je tylko odsylamy z powrotem.
  przypomnienia: {},     // id -> { id, zlecenie, tytul, notatka, data, godzina, przedMin, ... }
  usunietePrzyp: {},
  czekajaPrzyp: {}
};

/* ============ harmonogram odpadow, gmina Maciejowice 2026 ============
   Przepisane z harmonogramu EKOLIDER (odpady-2026.jpg — lezy w tym folderze).
   Kolory z oryginalu: czerwony = wszystko, zolty = tylko zmieszane i bio,
   niebieski = otwarty PSZOK (to nie wywoz, tylko mozna zawiezc samemu).

   Kontrola poprawnosci przepisania: czerwony wypada 12x, zawsze w piatek,
   raz na miesiac. PSZOK 6x, zawsze w sobote. Zolty 7x, w miesiacach IV-X
   (sezon bioodpadow) — z jednym wyjatkiem: 29 kwietnia to sroda, tak jest
   w oryginale. */
var ODPADY_ROK = 2026;
var ODPADY = [
  { d:"2026-01-16", t:"pelny" },  { d:"2026-01-24", t:"pszok" },
  { d:"2026-02-20", t:"pelny" },
  { d:"2026-03-14", t:"pszok" },  { d:"2026-03-20", t:"pelny" },
  { d:"2026-04-17", t:"pelny" },  { d:"2026-04-29", t:"zmieszane" },
  { d:"2026-05-15", t:"zmieszane" }, { d:"2026-05-29", t:"pelny" },
  { d:"2026-06-12", t:"zmieszane" }, { d:"2026-06-20", t:"pszok" },
  { d:"2026-06-26", t:"pelny" },
  { d:"2026-07-10", t:"zmieszane" }, { d:"2026-07-18", t:"pszok" },
  { d:"2026-07-24", t:"pelny" },
  { d:"2026-08-14", t:"zmieszane" }, { d:"2026-08-22", t:"pszok" },
  { d:"2026-08-28", t:"pelny" },
  { d:"2026-09-11", t:"zmieszane" }, { d:"2026-09-25", t:"pelny" },
  { d:"2026-10-09", t:"zmieszane" }, { d:"2026-10-10", t:"pszok" },
  { d:"2026-10-23", t:"pelny" },
  { d:"2026-11-20", t:"pelny" },
  { d:"2026-12-18", t:"pelny" }
];

var RODZAJE_ODPADOW = {
  pelny: {
    nazwa: "Wszystko",
    krotko: "wszystko",
    // [klasa CSS (bez ogonkow), frakcja, kolor worka do czytania]
    worki: [
      ["czarny",   "zmieszane",        "czarny"],
      ["zolty",    "metale i plastik", "żółty"],
      ["niebieski","papier",           "niebieski"],
      ["zielony",  "szkło",            "zielony"],
      ["brazowy",  "bio",              "brązowy"]
    ],
    uwaga: ""
  },
  zmieszane: {
    nazwa: "Tylko zmieszane i bio",
    krotko: "zmieszane + bio",
    worki: [

    ],

  },
  pszok: {

    krotko: "PSZOK 8–15",
    worki: [],
    uwaga: "To nie wywóz — w tych godzinach możesz zawieźć odpady sam: " +
           "Podłęż 59 (plac OSP) albo Maciejowice, ul. Lubelska 40 (Baza)."
  }
};

/* Powtarzanie terminow wlasnych (zakladka Terminy). Przypomnienia przy zleceniach
   sa zawsze jednorazowe — tam powtarzanie nie ma sensu. */
var POWTARZANIE = [
  { kod:"",        nazwa:"Jednorazowo", krotko:"" },
  { kod:"dzien",   nazwa:"Codziennie",  krotko:"codziennie" },
  { kod:"tydzien", nazwa:"Co tydzień",  krotko:"co tydzień" },
  { kod:"miesiac", nazwa:"Co miesiąc",  krotko:"co miesiąc" },
  { kod:"rok",     nazwa:"Co rok",      krotko:"co rok" }
];

/* Za ile przed terminem ma zadzwonic. Minuty, bo tak to przyjmuje Kalendarz Google. */
var PRZED_ILE = [
  { min:"0",     nazwa:"O godzinie",      krotko:"o godzinie" },
  { min:"30",    nazwa:"30 minut przed",  krotko:"30 min przed" },
  { min:"60",    nazwa:"Godzinę przed",   krotko:"godz. przed" },
  { min:"1440",  nazwa:"Dzień przed",     krotko:"dzień przed" },
  { min:"10080", nazwa:"Tydzień przed",   krotko:"tydzień przed" }
];

var STATUSY_INNE = {
  czeka:    { nazwa:"Do zrobienia", kolejnosc:0 },
  zrobione: { nazwa:"Zrobione",     kolejnosc:1 }
};
var STATUSY_ZAM = {
  doZamowienia: { nazwa:"Do zamówienia", kolejnosc:0 },
  zamowione:    { nazwa:"Zamówione",     kolejnosc:1 },
  dostarczone:  { nazwa:"Dostarczone",   kolejnosc:2 }
};

/* ============ narzędzia ============ */
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function naKlucz(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function dzisiaj(){ return naKlucz(new Date()); }
function zKlucza(k){ var c = k.split("-"); return new Date(+c[0], +c[1]-1, +c[2]); }
function dowPon(d){ return (d.getDay() + 6) % 7; }          // 0 = poniedziałek
function nowyId(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(z){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[z];
  });
}
function dataDluga(k){
  var d = zKlucza(k);
  return DNI[dowPon(d)] + ", " + d.getDate() + " " + MIESIACE_D[d.getMonth()];
}
function dataKrotka(k){
  var d = zKlucza(k);
  return d.getDate() + " " + MIESIACE_D[d.getMonth()] + " " + d.getFullYear();
}
function odmiana(n, jeden, kilka, wiele){
  if(n === 1) return jeden;
  var r10 = n % 10, r100 = n % 100;
  if(r10 >= 2 && r10 <= 4 && (r100 < 12 || r100 > 14)) return kilka;
  return wiele;
}
function liczba(n){ return String(Math.round(n * 100) / 100).replace(".", ","); }
function godzina(d){ return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
/* Ile godzin między "09:00" a "11:30". Ujemny wynik = robota przez północ. */
function godzinyMiedzy(od, doKiedy){
  var a = String(od || "").split(":"), b = String(doKiedy || "").split(":");
  if(a.length < 2 || b.length < 2) return null;
  var m1 = (+a[0]) * 60 + (+a[1]), m2 = (+b[0]) * 60 + (+b[1]);
  if(isNaN(m1) || isNaN(m2)) return null;
  var minut = m2 - m1;
  if(minut < 0) minut += 24 * 60;
  return Math.round(minut / 60 * 100) / 100;
}
function czasTekst(c){
  var n = parseFloat(String(c).replace(",", "."));
  return isNaN(n) ? "" : liczba(n) + " h";
}
function kmTekst(k){
  var n = parseFloat(String(k).replace(",", "."));
  return isNaN(n) ? "" : liczba(n) + " km";
}
/* Trasa do klienta jest stała, więc podpowiadamy tę z ostatniego zlecenia u niego. */
function ostatnieKm(klient){
  var n = (klient || "").trim().toLowerCase();
  if(!n) return "";
  var naj = null;
  wszystkie().forEach(function(z){
    if(!z.km || (z.klient || "").trim().toLowerCase() !== n) return;
    if(!naj || z.data > naj.data) naj = z;
  });
  if(naj) return naj.km;
  var c = stan.klienciWlasni[n];          // klient dopisany ręcznie, jeszcze bez zleceń
  return c && c.km ? c.km : "";
}
function podsumowanieMiesiaca(m){
  var przedrostek = m.r + "-" + pad(m.m + 1);
  var w = { ile:0, godz:0, km:0 };
  wszystkie().forEach(function(z){
    if(String(z.data).slice(0, 7) !== przedrostek) return;
    w.ile++;
    var g = parseFloat(String(z.czas || "").replace(",", "."));
    var k = parseFloat(String(z.km   || "").replace(",", "."));
    if(!isNaN(g)) w.godz += g;
    if(!isNaN(k)) w.km   += k;
  });
  return w;
}

/* ============ synchronizacja z Arkuszem Google ============
   Aplikacja rozmawia z małym skryptem Google Apps Script, który trzyma wszystko
   w arkuszu. Wysyłamy tylko to, co się u nas zmieniło, i przyjmujemy całość z powrotem.
   Przy sprzeczce wygrywa zapis z późniejszym znacznikiem "zmieniono". */
var KLUCZ_ADRES = "zlecenia.adresSync";
var adresSync = "";
var trwaWysylka = false;
var bladSync = "";
var ostrzezeniaSync = [];   // arkusz zapisany, ale kalendarz coś odbił
var czasomierzSync = null;

function wczytajAdres(){
  try{ adresSync = localStorage.getItem(KLUCZ_ADRES) || ""; }catch(e){ adresSync = ""; }
  return adresSync;
}
function ustawAdres(a){
  adresSync = String(a || "").trim();
  try{ localStorage.setItem(KLUCZ_ADRES, adresSync); }catch(e){}
}
function ileCzeka(){
  return Object.keys(stan.czekaja).length + Object.keys(stan.czekajaKlienci).length +
         Object.keys(stan.czekajaInne).length + Object.keys(stan.czekajaZamowienia).length +
         Object.keys(stan.czekajaZdjecia).length + Object.keys(stan.czekajaPrzyp).length;
}

function pokazSync(){
  var el = document.getElementById("stan-sync");
  if(!el) return;
  var ile = ileCzeka(), tryb, napis;
  if(!adresSync)       { tryb = "brak";  napis = "tylko tu"; }
  else if(bladSync)    { tryb = "blad";  napis = "błąd zapisu"; }
  else if(trwaWysylka) { tryb = "czeka"; napis = "wysyłam"; }
  else if(ile)         { tryb = "czeka"; napis = "czeka " + ile; }
  else if(ostrzezeniaSync.length) { tryb = "blad"; napis = "kalendarz!"; }
  else                 { tryb = "ok";    napis = "zsynchronizowane"; }
  el.innerHTML = '<span class="kropka ' + tryb + '"></span><span>' + napis + "</span>";
  el.title = bladSync || ostrzezeniaSync.join("; ") || "";
  var ikonaQr = document.getElementById("btn-qr");
  if(ikonaQr) ikonaQr.hidden = !adresSync;   // nie ma czego przekazywać bez adresu
}

/* Nie wysyłamy po każdym klawiszu — chwila zwłoki i jedna wysyłka. */
function wyslijCzekajace(){
  if(!adresSync) return;
  if(czasomierzSync) clearTimeout(czasomierzSync);
  czasomierzSync = setTimeout(function(){ synchronizuj(); }, 900);
}

function paczkaDoWyslania(idZlecen, kluczeKlientow, idInnych, idZamowien, idZdjec, idPrzyp){
  return {
    przypomnienia: (idPrzyp || []).map(function(id){
      if(stan.usunietePrzyp[id]){
        // wydarzenieId musi jechać razem z nagrobkiem, inaczej skrypt nie wie,
        // co zdjąć z kalendarza
        return { id:id, usuniete:stan.usunietePrzyp[id], zmieniono:stan.usunietePrzyp[id],
                 wydarzenieId:stan.usunietePrzyp[id + "|wyd"] || "" };
      }
      var p = stan.przypomnienia[id];
      if(!p) return null;
      // wydarzenieId i odcisk nadaje skrypt arkusza — odsylamy je nietkniete,
      // tak samo jak plikId przy zdjeciach
      return { id:p.id, zlecenie:p.zlecenie || "", tytul:p.tytul || "",
               notatka:p.notatka || "", data:p.data || "", godzina:p.godzina || "",
               przedMin:String(p.przedMin == null ? "0" : p.przedMin),
               powtarzanie:p.powtarzanie || "",
               wydarzenieId:p.wydarzenieId || "", odcisk:p.odcisk || "",
               zmieniono:p.zmieniono || "", usuniete:"" };
    }).filter(Boolean),
    zdjecia: (idZdjec || []).map(function(id){
      if(stan.usunieteZdjecia[id]){
        return { id:id, usuniete:stan.usunieteZdjecia[id], zmieniono:stan.usunieteZdjecia[id],
                 plikId:stan.usunieteZdjecia[id + "|plik"] || "" };
      }
      var z = stan.zdjecia[id];
      if(!z) return null;
      return { id:z.id, zlecenie:z.zlecenie || "", nazwa:z.nazwa || "",
               plikId:z.plikId || "", dane:z.dane || "", zmieniono:z.zmieniono || "", usuniete:"" };
    }).filter(Boolean),
    inne: (idInnych || []).map(function(id){
      if(stan.usunieteInne[id]){
        return { id:id, usuniete:stan.usunieteInne[id], zmieniono:stan.usunieteInne[id] };
      }
      var i = stan.inne[id];
      if(!i) return null;
      return { id:i.id, klient:i.klient || "", opis:i.opis || "", czas:i.czas || "",
               status:i.status || "czeka", zmieniono:i.zmieniono || "", usuniete:"" };
    }).filter(Boolean),
    zamowienia: (idZamowien || []).map(function(id){
      if(stan.usunieteZamowienia[id]){
        return { id:id, usuniete:stan.usunieteZamowienia[id], zmieniono:stan.usunieteZamowienia[id] };
      }
      var z = stan.zamowienia[id];
      if(!z) return null;
      return { id:z.id, rzecz:z.rzecz || "", ilosc:z.ilosc || "", cena:z.cena || "",
               klient:z.klient || "", status:z.status || "doZamowienia",
               zmieniono:z.zmieniono || "", usuniete:"" };
    }).filter(Boolean),
    zlecenia: idZlecen.map(function(id){
      if(stan.usuniete[id]){
        return { id:id, usuniete:stan.usuniete[id], zmieniono:stan.usuniete[id] };
      }
      var z = stan.zlecenia[id];
      if(!z) return null;
      return { id:z.id, data:z.data || "", od:z.od || "", do:z.do || "", czas:z.czas || "",
               km:z.km || "", klient:z.klient || "", opis:z.opis || "",
               status:z.status || "zrobione", nastepnym:z.nastepnym || "",
               zmieniono:z.zmieniono || "", usuniete:"" };
    }).filter(Boolean),
    klienci: kluczeKlientow.map(function(k){
      if(stan.usunieciKlienci[k]){
        return { klucz:k, usuniete:stan.usunieciKlienci[k], zmieniono:stan.usunieciKlienci[k] };
      }
      var c = stan.klienciWlasni[k];
      if(!c) return null;
      return { klucz:k, nazwa:c.nazwa || "", km:c.km || "",
               zmieniono:c.zmieniono || "", usuniete:"" };
    }).filter(Boolean)
  };
}

function przyjmijZSerwera(odp){
  var zlecenia = {}, usuniete = {}, klienci = {}, usunieciKlienci = {};

  (odp.zlecenia || []).forEach(function(z){
    if(!z || !z.id) return;
    if(z.usuniete){ usuniete[z.id] = z.usuniete; return; }
    zlecenia[z.id] = {
      id:z.id, data:z.data, od:z.od || "", do:z.do || "", czas:z.czas || "", km:z.km || "",
      klient:z.klient || "", opis:z.opis || "",
      status: STATUSY[z.status] ? z.status : "zrobione",
      nastepnym:z.nastepnym || "", zmieniono:z.zmieniono || ""
    };
  });
  (odp.klienci || []).forEach(function(c){
    if(!c || !c.klucz) return;
    if(c.usuniete){ usunieciKlienci[c.klucz] = c.usuniete; return; }
    klienci[c.klucz] = { nazwa:c.nazwa || "", km:c.km || "", zmieniono:c.zmieniono || "" };
  });

  // to, co u nas dalej czeka na wysyłkę, jest świeższe niż ta odpowiedź — zostaje po naszemu
  Object.keys(stan.czekaja).forEach(function(id){
    if(stan.usuniete[id]){ usuniete[id] = stan.usuniete[id]; delete zlecenia[id]; }
    else if(stan.zlecenia[id]){ zlecenia[id] = stan.zlecenia[id]; delete usuniete[id]; }
  });
  Object.keys(stan.czekajaKlienci).forEach(function(k){
    if(stan.usunieciKlienci[k]){ usunieciKlienci[k] = stan.usunieciKlienci[k]; delete klienci[k]; }
    else if(stan.klienciWlasni[k]){ klienci[k] = stan.klienciWlasni[k]; delete usunieciKlienci[k]; }
  });

  stan.zlecenia = zlecenia;
  stan.usuniete = usuniete;
  stan.klienciWlasni = klienci;
  stan.usunieciKlienci = usunieciKlienci;

  // Arkusz ze starym skryptem nie zna "innych" i zamówień — wtedy tych pól po
  // prostu nie ma w odpowiedzi i zostajemy przy tym, co mamy u siebie.
  if(odp.inne){
    var inne = {}, usunieteInne = {};
    odp.inne.forEach(function(i){
      if(!i || !i.id) return;
      if(i.usuniete){ usunieteInne[i.id] = i.usuniete; return; }
      inne[i.id] = { id:i.id, klient:i.klient || "", opis:i.opis || "", czas:i.czas || "",
                     status: STATUSY_INNE[i.status] ? i.status : "czeka",
                     zmieniono:i.zmieniono || "" };
    });
    Object.keys(stan.czekajaInne).forEach(function(id){
      if(stan.usunieteInne[id]){ usunieteInne[id] = stan.usunieteInne[id]; delete inne[id]; }
      else if(stan.inne[id]){ inne[id] = stan.inne[id]; delete usunieteInne[id]; }
    });
    stan.inne = inne;
    stan.usunieteInne = usunieteInne;
  }

  if(odp.zdjecia){
    var zdj = {}, usunieteZdj = {};
    odp.zdjecia.forEach(function(z){
      if(!z || !z.id) return;
      if(z.usuniete){ usunieteZdj[z.id] = z.usuniete; return; }
      zdj[z.id] = { id:z.id, zlecenie:z.zlecenie || "", nazwa:z.nazwa || "",
                    plikId:z.plikId || "", dane:"", zmieniono:z.zmieniono || "" };
    });
    Object.keys(stan.czekajaZdjecia).forEach(function(id){
      if(stan.usunieteZdjecia[id]){ usunieteZdj[id] = stan.usunieteZdjecia[id]; delete zdj[id]; }
      else if(stan.zdjecia[id]){ zdj[id] = stan.zdjecia[id]; delete usunieteZdj[id]; }
    });
    stan.zdjecia = zdj;
    stan.usunieteZdjecia = usunieteZdj;
  }

  if(odp.zamowienia){
    var zam = {}, usunieteZam = {};
    odp.zamowienia.forEach(function(z){
      if(!z || !z.id) return;
      if(z.usuniete){ usunieteZam[z.id] = z.usuniete; return; }
      zam[z.id] = { id:z.id, rzecz:z.rzecz || "", ilosc:z.ilosc || "", cena:z.cena || "",
                    klient:z.klient || "",
                    status: STATUSY_ZAM[z.status] ? z.status : "doZamowienia",
                    zmieniono:z.zmieniono || "" };
    });
    Object.keys(stan.czekajaZamowienia).forEach(function(id){
      if(stan.usunieteZamowienia[id]){ usunieteZam[id] = stan.usunieteZamowienia[id]; delete zam[id]; }
      else if(stan.zamowienia[id]){ zam[id] = stan.zamowienia[id]; delete usunieteZam[id]; }
    });
    stan.zamowienia = zam;
    stan.usunieteZamowienia = usunieteZam;
  }

  // Tak samo jak wyżej: arkusz ze starym skryptem nie zna przypomnień. Wtedy tego
  // pola nie ma w odpowiedzi i zostajemy przy tym, co mamy u siebie — przypomnienia
  // działają wtedy jako notatka z datą, tylko telefon nie zadzwoni.
  if(odp.przypomnienia){
    var przyp = {}, usunPrzyp = {};
    odp.przypomnienia.forEach(function(p){
      if(!p || !p.id) return;
      if(p.usuniete){ usunPrzyp[p.id] = p.usuniete; return; }
      przyp[p.id] = { id:p.id, zlecenie:p.zlecenie || "", tytul:p.tytul || "",
                      notatka:p.notatka || "", data:p.data || "", godzina:p.godzina || "",
                      przedMin:p.przedMin || "0", powtarzanie:p.powtarzanie || "",
                      wydarzenieId:p.wydarzenieId || "", odcisk:p.odcisk || "",
                      zmieniono:p.zmieniono || "" };
    });
    Object.keys(stan.czekajaPrzyp).forEach(function(id){
      if(stan.usunietePrzyp[id]){ usunPrzyp[id] = stan.usunietePrzyp[id]; delete przyp[id]; }
      else if(stan.przypomnienia[id]){ przyp[id] = stan.przypomnienia[id]; delete usunPrzyp[id]; }
    });
    stan.przypomnienia = przyp;
    stan.usunietePrzyp = usunPrzyp;
  }

  // Skrypt mógł zapisać do arkusza, ale nie dać rady z kalendarzem — wtedy
  // przysyła listę ostrzeżeń. Pokazujemy je pod przyciskiem Połącz.
  ostrzezeniaSync = (odp.ostrzezenia || []).slice(0, 8);
}

function synchronizuj(){
  if(!adresSync || trwaWysylka) return Promise.resolve(false);
  trwaWysylka = true; bladSync = ""; pokazSync();

  var idZlecen = Object.keys(stan.czekaja);
  var kluczeKlientow = Object.keys(stan.czekajaKlienci);
  var idInnych = Object.keys(stan.czekajaInne);
  var idZamowien = Object.keys(stan.czekajaZamowienia);
  var idZdjec = Object.keys(stan.czekajaZdjecia);
  var idPrzyp = Object.keys(stan.czekajaPrzyp);

  return fetch(adresSync, {
    method: "POST",
    // text/plain, bo przy application/json Google żąda dodatkowej zgody i odbija zapytanie
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(paczkaDoWyslania(idZlecen, kluczeKlientow, idInnych,
                                          idZamowien, idZdjec, idPrzyp))
  }).then(function(o){
    if(!o.ok) throw new Error("arkusz odpowiedział błędem " + o.status);
    return o.json();
  }).then(function(odp){
    if(!odp || !odp.ok) throw new Error((odp && odp.blad) || "arkusz odpowiedział nie po naszemu");
    idZlecen.forEach(function(id){ delete stan.czekaja[id]; });
    kluczeKlientow.forEach(function(k){ delete stan.czekajaKlienci[k]; });
    idInnych.forEach(function(id){ delete stan.czekajaInne[id]; });
    idZamowien.forEach(function(id){ delete stan.czekajaZamowienia[id]; });
    idZdjec.forEach(function(id){ delete stan.czekajaZdjecia[id]; });
    idPrzyp.forEach(function(id){ delete stan.czekajaPrzyp[id]; });
    przyjmijZSerwera(odp);
    zapiszLokalnie();
    trwaWysylka = false; bladSync = ""; pokazSync();
    if(!stan.formularz && !stan.klientForm) rysuj();
    return true;
  }).catch(function(e){
    trwaWysylka = false;
    bladSync = String((e && e.message) || e);
    pokazSync();
    return false;   // nic nie ginie — wszystko czeka w telefonie do następnej próby
  });
}

/* Adres można podać linkiem: .../zlecenia/#adres=... — tak działa kod QR z laptopa.
   Po odczytaniu czyścimy go z paska adresu, żeby nie wisiał na widoku. */
function adresZLinku(){
  var hasz = location.hash || "";
  var gdzie = hasz.indexOf("adres=");
  if(gdzie === -1) return false;
  var a;
  try{ a = decodeURIComponent(hasz.slice(gdzie + 6)); }catch(e){ a = hasz.slice(gdzie + 6); }
  a = String(a).replace(/\s+/g, "");
  while(a.slice(-1) === "/") a = a.slice(0, -1);
  if(!a) return false;
  ustawAdres(a);
  Object.keys(stan.zlecenia).forEach(function(id){ stan.czekaja[id] = true; });
  Object.keys(stan.klienciWlasni).forEach(function(k){ stan.czekajaKlienci[k] = true; });
  zapiszLokalnie();
  try{ history.replaceState(null, "", location.pathname + location.search); }
  catch(e){ location.hash = ""; }
  return true;
}

function podlaczBaze(){
  wczytajAdres();
  var zLinku = adresZLinku();
  pokazSync();
  if(zLinku){
    synchronizuj().then(function(udane){
      if(udane) rysuj();
    });
  }
  if(!adresSync) return;
  synchronizuj();
  setInterval(function(){
    if(document.visibilityState === "visible" && !stan.formularz) synchronizuj();
  }, 90000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") synchronizuj();
  });
  window.addEventListener("online", function(){ synchronizuj(); });
}
/* ============ zlecenia ============ */
function zapiszZlecenie(z){
  z.zmieniono = new Date().toISOString();
  stan.zlecenia[z.id] = z;
  delete stan.usuniete[z.id];
  stan.czekaja[z.id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}
function usunZlecenie(id){
  delete stan.zlecenia[id];
  stan.usuniete[id] = new Date().toISOString();
  stan.czekaja[id] = true;
  usunPrzypomnienie(id);          // razem ze zleceniem leci jego przypomnienie
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}

/* ============ przypomnienia „na następny raz" ============
   Jedno przypomnienie na zlecenie, id = "p-" + id zlecenia. Aplikacja trzyma tu
   tylko treść i termin; wydarzenie w Kalendarzu Google zakłada skrypt arkusza,
   bo przeglądarka nie umie sama zadzwonić przy zamkniętej aplikacji. */

function idPrzypomnienia(idZlecenia){ return "p-" + idZlecenia; }

function przypDlaZlecenia(idZlecenia){
  return stan.przypomnienia[idPrzypomnienia(idZlecenia)] || null;
}

/** Z czego robimy tytuł wydarzenia w kalendarzu — tak, żeby po dzwonku
 *  od razu było widać u kogo i co, bez wchodzenia w aplikację. */
function tytulPrzypomnienia(z){
  var co = (z.nastepnym || "").trim() || (z.opis || "").trim();
  var kto = (z.klient || "").trim();
  if(kto && co) return kto + " — " + co;
  return kto || co || "Przypomnienie";
}

/** Zapisuje albo zdejmuje termin przypomnienia dla zlecenia.
 *  data === "" znaczy „bez przypomnienia" — wiersz zostaje, ale skrypt
 *  zdejmie wydarzenie z kalendarza. */
function ustawPrzypomnienie(z, data, godzina, przedMin){
  var id = idPrzypomnienia(z.id);
  var stare = stan.przypomnienia[id];

  if(!data && !stare) return;                 // nie było i nie ma — nic nie zapisujemy

  var p = stare || { id:id, zlecenie:z.id, wydarzenieId:"", odcisk:"" };
  p.zlecenie = z.id;
  p.tytul = data ? tytulPrzypomnienia(z) : (p.tytul || "");
  p.notatka = data ? (z.opis || "") : (p.notatka || "");
  p.data = data || "";
  p.godzina = data ? (godzina || "09:00") : "";
  p.przedMin = String(przedMin == null ? "0" : przedMin);
  p.zmieniono = new Date().toISOString();

  stan.przypomnienia[id] = p;
  delete stan.usunietePrzyp[id];
  stan.czekajaPrzyp[id] = true;
}

function usunPrzypomnienie(idZlecenia){
  var id = idPrzypomnienia(idZlecenia);
  if(!stan.przypomnienia[id] && !stan.czekajaPrzyp[id]) return;
  // Zapamiętujemy, które wydarzenie w kalendarzu należało do tego przypomnienia.
  // Bez tego nagrobek wyczyściłby tę kolumnę w arkuszu i skrypt nie miałby już
  // czego usunąć — wydarzenie zostałoby w kalendarzu na zawsze.
  // Ten sam chwyt co przy zdjęciach (usunieteZdjecia[id + "|plik"]).
  var byle = stan.przypomnienia[id];
  if(byle && byle.wydarzenieId) stan.usunietePrzyp[id + "|wyd"] = byle.wydarzenieId;
  delete stan.przypomnienia[id];
  stan.usunietePrzyp[id] = new Date().toISOString();
  stan.czekajaPrzyp[id] = true;
}

/** Przypomnienia przy zleceniach, których termin już minął, od najstarszego.
 *  Tylko te, które mają jeszcze swoje zlecenie. Terminy własne (bez zlecenia)
 *  liczy zalegleTerminy() — te pokazujemy w zakładce Terminy. */
function zaleglePrzypomnienia(){
  var terazData = dzisiaj();
  var terazGodz = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes());
  var lista = [];
  Object.keys(stan.przypomnienia).forEach(function(id){
    var p = stan.przypomnienia[id];
    if(!p || !p.data || !p.zlecenie) return;
    if(!stan.zlecenia[p.zlecenie]) return;
    var minelo = p.data < terazData ||
                 (p.data === terazData && String(p.godzina || "") <= terazGodz);
    if(minelo) lista.push(p);
  });
  return lista.sort(function(a,b){
    return (a.data + " " + (a.godzina || "")).localeCompare(b.data + " " + (b.godzina || ""));
  });
}

function nazwaPrzed(min){
  for(var i = 0; i < PRZED_ILE.length; i++){
    if(PRZED_ILE[i].min === String(min == null ? "0" : min)) return PRZED_ILE[i].krotko;
  }
  return "";
}
function nazwaPowtarzania(kod){
  for(var i = 0; i < POWTARZANIE.length; i++){
    if(POWTARZANIE[i].kod === String(kod || "")) return POWTARZANIE[i].krotko;
  }
  return "";
}

/* ============ terminy własne (zakładka Terminy) ============
   Drugi kalendarz: przypomnienia niezwiązane z żadnym zleceniem — ubezpieczenie,
   przegląd auta, kopie configów. Mogą się powtarzać. Siedzą w tym samym worku
   co przypomnienia przy zleceniach, tylko z pustym polem "zlecenie". */

function terminy(){
  var w = [];
  Object.keys(stan.przypomnienia).forEach(function(id){
    var p = stan.przypomnienia[id];
    if(p && !p.zlecenie && p.data) w.push(p);
  });
  return w;
}

/** Czy termin wypada w danym dniu — po to, żeby narysować kalendarz.
    Kalendarz Google liczy to po swojemu, z reguły powtarzania, więc obie
    strony muszą się zgadzać. */
function wypadaW(p, klucz){
  if(!p.data || klucz < p.data) return false;
  if(!p.powtarzanie) return klucz === p.data;
  if(p.powtarzanie === "dzien") return true;

  var start = zKlucza(p.data), badany = zKlucza(klucz);
  if(p.powtarzanie === "tydzien") return start.getDay() === badany.getDay();

  if(p.powtarzanie === "miesiac"){
    // 31. dnia w krótszym miesiącu termin wypada ostatniego dnia
    var ostatni = new Date(badany.getFullYear(), badany.getMonth() + 1, 0).getDate();
    return badany.getDate() === Math.min(start.getDate(), ostatni);
  }
  if(p.powtarzanie === "rok"){
    if(start.getMonth() === 1 && start.getDate() === 29){
      var luty = new Date(badany.getFullYear(), 2, 0).getDate();   // 28 albo 29
      return badany.getMonth() === 1 && badany.getDate() === Math.min(29, luty);
    }
    return start.getMonth() === badany.getMonth() && start.getDate() === badany.getDate();
  }
  return false;
}

/** Najbliższy dzień, w którym termin wypada — licząc od "od" włącznie. */
function nastepneWystapienie(p, od){
  od = od || dzisiaj();
  if(!p.powtarzanie) return p.data;
  if(p.data >= od) return p.data;
  var d = zKlucza(od);
  for(var i = 0; i < 400; i++){            // 400 dni starczy nawet na "co rok"
    var k = naKlucz(d);
    if(wypadaW(p, k)) return k;
    d.setDate(d.getDate() + 1);
  }
  return p.data;
}

function terminyWDniu(klucz){
  return terminy().filter(function(p){ return wypadaW(p, klucz); })
    .sort(function(a,b){ return String(a.godzina||"").localeCompare(String(b.godzina||"")); });
}

/** Terminy własne po dacie, od najpilniejszego. Powtarzające się nigdy nie są
    zaległe — zawsze mają następne wystąpienie w przyszłości. */
function kolejkaTerminow(){
  var dzis = dzisiaj();
  var terazGodz = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes());
  return terminy().map(function(p){
    var kiedy = nastepneWystapienie(p);
    var zalegly = !p.powtarzanie &&
                  (kiedy < dzis || (kiedy === dzis && String(p.godzina || "") <= terazGodz));
    return { p:p, kiedy:kiedy, zalegly:zalegly };
  }).sort(function(a,b){
    if(a.zalegly !== b.zalegly) return a.zalegly ? -1 : 1;
    if(a.kiedy !== b.kiedy) return a.kiedy < b.kiedy ? -1 : 1;
    return String(a.p.godzina||"").localeCompare(String(b.p.godzina||""));
  });
}

function ileZaleglychTerminow(){
  return kolejkaTerminow().filter(function(x){ return x.zalegly; }).length;
}

function zapiszTermin(p){
  p.zlecenie = "";                       // to jest termin własny, nie od zlecenia
  p.zmieniono = new Date().toISOString();
  stan.przypomnienia[p.id] = p;
  delete stan.usunietePrzyp[p.id];
  stan.czekajaPrzyp[p.id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}

function usunTermin(id){
  var byle = stan.przypomnienia[id];
  // wydarzenieId musi pojechać z nagrobkiem, inaczej skrypt nie wie, co zdjąć
  if(byle && byle.wydarzenieId) stan.usunietePrzyp[id + "|wyd"] = byle.wydarzenieId;
  delete stan.przypomnienia[id];
  stan.usunietePrzyp[id] = new Date().toISOString();
  stan.czekajaPrzyp[id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}

/** Kawałek formularza pod „Na następny raz": ptaszek, a po zaznaczeniu data,
 *  godzina i za ile przed ma zadzwonić. */
function polePrzypomnienia(z){
  var p = przypDlaZlecenia(z.id);
  var wlaczone = !!(p && p.data);
  var data = (p && p.data) || oDniPrzod(7);
  var godzina = (p && p.godzina) || "09:00";
  var przed = (p && p.przedMin) || "0";

  return '<div class="pole przypomnienie">' +
    '<label class="ptaszek" for="f-przyp-wl">' +
      '<input type="checkbox" id="f-przyp-wl"' + (wlaczone ? " checked" : "") + '>' +
      "<span>Przypomnij mi o tym</span></label>" +
    '<div class="przyp-szczegoly" id="f-przyp-szczegoly"' + (wlaczone ? "" : " hidden") + '>' +
      '<div class="para">' +
        '<div class="pole"><label for="f-przyp-data">Kiedy</label>' +
          '<input id="f-przyp-data" type="date" value="' + esc(data) + '"></div>' +
        '<div class="pole"><label for="f-przyp-godz">Godzina</label>' +
          '<input id="f-przyp-godz" type="time" value="' + esc(godzina) + '"></div>' +
      "</div>" +
      '<div class="pole"><label for="f-przyp-przed">Dzwonek</label>' +
        '<select id="f-przyp-przed">' +
          PRZED_ILE.map(function(o){
            return '<option value="' + o.min + '"' +
                   (String(przed) === o.min ? " selected" : "") + ">" + o.nazwa + "</option>";
          }).join("") +
        "</select></div>" +
      '<p class="objasnienie-przyp">Termin trafi do Kalendarza Google (kalendarz ' +
        "„Przypomnienia”) i telefon zadzwoni sam. Bez połączenia z arkuszem " +
        "zostaje tylko notatką z datą.</p>" +
    "</div></div>";
}

/** Data za tyle dni, w formacie RRRR-MM-DD. */
function oDniPrzod(ile){
  var d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + ile);
  return naKlucz(d);
}
function wszystkie(){
  return Object.keys(stan.zlecenia).map(function(k){ return stan.zlecenia[k]; });
}
function wDniu(k){
  return wszystkie().filter(function(z){ return z.data === k; })
    .sort(function(a,b){ return STATUSY[a.status].kolejnosc - STATUSY[b.status].kolejnosc; });
}
/* Klienci z dwóch źródeł: z zapisanych zleceń i z listy prowadzonej ręcznie. */
function klienci(){
  var mapa = {};
  function daj(nazwa){
    var n = String(nazwa || "").trim();
    if(!n) return null;
    var k = n.toLowerCase();
    if(!mapa[k]) mapa[k] = { klucz:k, nazwa:n, ile:0, ostatnia:"", otwarte:0,
                             trasa:"", trasaData:"", zListy:false };
    return mapa[k];
  }
  wszystkie().forEach(function(z){
    var m = daj(z.klient);
    if(!m) return;
    m.ile++;
    if(z.data > m.ostatnia) m.ostatnia = z.data;
    if(z.status !== "zrobione") m.otwarte++;
    if(z.km && z.data >= m.trasaData){ m.trasa = z.km; m.trasaData = z.data; }
  });
  Object.keys(stan.klienciWlasni).forEach(function(k){
    var c = stan.klienciWlasni[k];
    var m = daj(c && c.nazwa);
    if(!m) return;
    m.zListy = true;
    if(!m.trasa && c.km) m.trasa = c.km;
  });
  return Object.keys(mapa).map(function(k){ return mapa[k]; })
    .sort(function(a,b){
      if(a.ostatnia !== b.ostatnia) return b.ostatnia.localeCompare(a.ostatnia);
      return a.nazwa.localeCompare(b.nazwa, "pl");
    });
}

function zapiszKlienta(staryKlucz, nazwa, km){
  var n = String(nazwa || "").trim();
  if(!n) return false;
  var klucz = n.toLowerCase();
  if(staryKlucz && staryKlucz !== klucz){
    // zmiana nazwy — przepisujemy ją też w dotychczasowych zleceniach
    var stara = stan.klienciWlasni[staryKlucz];
    var staraNazwa = stara ? stara.nazwa : "";
    delete stan.klienciWlasni[staryKlucz];
    if(staraNazwa){
      wszystkie().forEach(function(z){
        if((z.klient || "").trim().toLowerCase() !== staryKlucz) return;
        z.klient = n;
        zapiszZlecenie(z);
      });
    }
  }
  stan.klienciWlasni[klucz] = { nazwa:n, km:String(km || "").trim(),
                                zmieniono:new Date().toISOString() };
  delete stan.usunieciKlienci[klucz];
  stan.czekajaKlienci[klucz] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
  return true;
}
function usunKlientaZListy(klucz){
  delete stan.klienciWlasni[klucz];
  stan.usunieciKlienci[klucz] = new Date().toISOString();
  stan.czekajaKlienci[klucz] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}

/* ============ inne zlecenia (bez daty) ============ */
function zapiszInne(i){
  i.zmieniono = new Date().toISOString();
  stan.inne[i.id] = i;
  delete stan.usunieteInne[i.id];
  stan.czekajaInne[i.id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}
function usunInne(id){
  delete stan.inne[id];
  stan.usunieteInne[id] = new Date().toISOString();
  stan.czekajaInne[id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}
/* Najpierw do zrobienia, w obrębie statusu najnowsze na górze. */
function wszystkieInne(){
  return Object.keys(stan.inne).map(function(k){ return stan.inne[k]; })
    .sort(function(a, b){
      var sa = (STATUSY_INNE[a.status] || STATUSY_INNE.czeka).kolejnosc;
      var sb = (STATUSY_INNE[b.status] || STATUSY_INNE.czeka).kolejnosc;
      if(sa !== sb) return sa - sb;
      return String(b.zmieniono || "").localeCompare(String(a.zmieniono || ""));
    });
}
function podsumowanieInnych(){
  var w = { ile:0, doZrobienia:0, godz:0 };
  wszystkieInne().forEach(function(i){
    w.ile++;
    if(i.status !== "zrobione") w.doZrobienia++;
    var g = parseFloat(String(i.czas || "").replace(",", "."));
    if(!isNaN(g)) w.godz += g;
  });
  return w;
}

/* ============ co trzeba zamówić ============ */
function zapiszZamowienie(z){
  z.zmieniono = new Date().toISOString();
  stan.zamowienia[z.id] = z;
  delete stan.usunieteZamowienia[z.id];
  stan.czekajaZamowienia[z.id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}
function usunZamowienie(id){
  delete stan.zamowienia[id];
  stan.usunieteZamowienia[id] = new Date().toISOString();
  stan.czekajaZamowienia[id] = true;
  zapiszLokalnie(); wyslijCzekajace(); pokazSync();
}
function wszystkieZamowienia(){
  return Object.keys(stan.zamowienia).map(function(k){ return stan.zamowienia[k]; })
    .sort(function(a, b){
      var sa = (STATUSY_ZAM[a.status] || STATUSY_ZAM.doZamowienia).kolejnosc;
      var sb = (STATUSY_ZAM[b.status] || STATUSY_ZAM.doZamowienia).kolejnosc;
      if(sa !== sb) return sa - sb;
      return String(b.zmieniono || "").localeCompare(String(a.zmieniono || ""));
    });
}
/* Ilość × cena. Puste pola traktujemy jak brak, nie jak zero. */
function wartoscZamowienia(z){
  var il = parseFloat(String(z.ilosc || "").replace(",", "."));
  var c  = parseFloat(String(z.cena  || "").replace(",", "."));
  if(isNaN(il) || isNaN(c)) return null;
  return Math.round(il * c * 100) / 100;
}
function zlotowki(n){ return liczba(Math.round(n * 100) / 100) + " zł"; }
function podsumowanieZamowien(){
  var w = { ile:0, doZamowienia:0, sztuk:0, wartosc:0 };
  wszystkieZamowienia().forEach(function(z){
    w.ile++;
    if(z.status === "doZamowienia") w.doZamowienia++;
    var il = parseFloat(String(z.ilosc || "").replace(",", "."));
    if(!isNaN(il)) w.sztuk += il;
    var v = wartoscZamowienia(z);
    if(v !== null) w.wartosc += v;
  });
  return w;
}
/* Rozbicie zamówień na firmy — ile sztuk i za ile u kogo. */
function zamowieniaWgFirm(){
  var wg = {};
  wszystkieZamowienia().forEach(function(z){
    var nazwa = (z.klient || "").trim();
    var klucz = nazwa.toLowerCase() || "(bez klienta)";
    var w = wg[klucz] || (wg[klucz] = { nazwa: nazwa || "Bez klienta", ile:0, sztuk:0, wartosc:0 });
    w.ile++;
    var il = parseFloat(String(z.ilosc || "").replace(",", "."));
    if(!isNaN(il)) w.sztuk += il;
    var v = wartoscZamowienia(z);
    if(v !== null) w.wartosc += v;
  });
  return Object.keys(wg).map(function(k){ return wg[k]; })
    .sort(function(a, b){
      if(b.wartosc !== a.wartosc) return b.wartosc - a.wartosc;
      return a.nazwa.localeCompare(b.nazwa, "pl");
    });
}

/* ============ stoper ============
   Start przy wejściu do klienta, Zakończ przy wyjściu. Liczy się od zapisanej
   godziny startu, więc zgaszony ekran, zamknięta aplikacja ani brak zasięgu
   nic mu nie robią — po powrocie czas jest policzony do bieżącej chwili. */
function trwaPomiar(){ return !!(stan.pomiar && stan.pomiar.start); }
function ileTrwa(){
  return trwaPomiar() ? Math.max(0, Date.now() - new Date(stan.pomiar.start).getTime()) : 0;
}
function zegar(ms){
  var s = Math.floor(ms / 1000);
  return Math.floor(s / 3600) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
}
function naGodziny(ms){                       // do kwadransa w górę, minimum 15 minut
  return Math.max(0.25, Math.round(ms / 900000) * 0.25) || 0.25;
}
function poGodzinach(ms){
  var g = Math.floor(ms / 3600000), m = Math.round(ms % 3600000 / 60000);
  if(m === 60){ g++; m = 0; }
  return g ? g + " godz. " + m + " min" : m + " min";
}

function startPomiaru(){
  stan.pomiar = { start: new Date().toISOString() };
  zapiszLokalnie(); rysujPasek();
}
/* Nowe zlecenie z tego, co zmierzył stoper: data i godziny z prawdziwych znaczników. */
function zlecenieZPomiaru(){
  var p = stan.pomiar || {};
  var ms = p.zmierzone != null ? p.zmierzone : ileTrwa();
  var s = new Date(p.od || p.start || Date.now());
  var k = new Date(p.doKiedy || Date.now());
  return {
    id: nowyId(), data: naKlucz(s), klient: "", opis: "",
    status: "zrobione", czas: String(naGodziny(ms)).replace(".", ","),
    od: godzina(s), do: godzina(k), km: "", nastepnym: "", zPomiaru: true
  };
}
function zakonczPomiar(){
  var start = new Date(stan.pomiar.start);
  var teraz = new Date();
  stan.pomiar = { zmierzone: ileTrwa(), od: start.toISOString(), doKiedy: teraz.toISOString() };
  zapiszLokalnie(); rysujPasek();
  otworzFormularz(zlecenieZPomiaru());
}
function porzucPomiar(){
  stan.pomiar = null;
  zapiszLokalnie(); rysujPasek();
}

function rysujPasek(){
  var el = document.getElementById("pomiar");
  if(!el) return;

  if(trwaPomiar()){
    el.className = "pomiar dziala";
    el.innerHTML = '<span class="p-kropka"></span>' +
      '<span class="p-zegar" id="p-zegar">' + zegar(ileTrwa()) + "</span>" +
      '<span class="p-opis">robota w toku</span>' +
      '<button class="p-akcja" id="p-zakoncz">Zakończ</button>';
    document.getElementById("p-zakoncz").onclick = zakonczPomiar;
    return;
  }

  if(stan.pomiar && stan.pomiar.zmierzone != null){
    el.className = "pomiar zmierzony";
    el.innerHTML = '<span class="p-zegar">' + zegar(stan.pomiar.zmierzone) + "</span>" +
      '<span class="p-opis">zmierzone, jeszcze niezapisane</span>' +
      '<button class="p-drobny" id="p-porzuc">Odrzuć</button>' +
      '<button class="p-akcja" id="p-zapisz">Zapisz</button>';
    document.getElementById("p-zapisz").onclick = function(){
      otworzFormularz(zlecenieZPomiaru());
    };
    var porzuc = document.getElementById("p-porzuc");
    porzuc.onclick = function(){
      if(porzuc.dataset.pewny){ porzucPomiar(); return; }
      porzuc.dataset.pewny = "1";

    };
    return;
  }

  el.className = "pomiar";
  el.innerHTML = '<button class="p-start" id="p-start">▶ Start Praca</button>';
  document.getElementById("p-start").onclick = startPomiaru;
}

/* Ile czasu zeszło u której firmy. Zliczamy po nazwie klienta (bez względu na
   wielkość liter), żeby "PAKMAR" i "Pakmar" nie rozjechały się na dwie pozycje. */
function czasWgFirm(zakres){
  var przedrostek = stan.miesiac.r + "-" + pad(stan.miesiac.m + 1);
  var wg = {};
  wszystkie().forEach(function(z){
    if(zakres !== "wszystko" && String(z.data).slice(0, 7) !== przedrostek) return;
    var nazwa = (z.klient || "").trim();
    var klucz = nazwa.toLowerCase() || "(bez klienta)";
    var w = wg[klucz] || (wg[klucz] = { nazwa: nazwa || "Bez klienta", ile:0, godz:0, km:0 });
    w.ile++;
    var g = parseFloat(String(z.czas || "").replace(",", "."));
    var k = parseFloat(String(z.km   || "").replace(",", "."));
    if(!isNaN(g)) w.godz += g;
    if(!isNaN(k)) w.km   += k;
  });
  return Object.keys(wg).map(function(k){ return wg[k]; })
    .sort(function(a, b){
      if(b.godz !== a.godz) return b.godz - a.godz;      // najwięcej godzin na górze
      return a.nazwa.localeCompare(b.nazwa, "pl");
    });
}

function sekcjaFirm(){
  var zakres = stan.firmyZakres === "wszystko" ? "wszystko" : "miesiac";
  var lista = czasWgFirm(zakres);
  var suma = lista.reduce(function(w, f){
    w.ile += f.ile; w.godz += f.godz; w.km += f.km; return w;
  }, { ile:0, godz:0, km:0 });

  var gora = '<button class="firmy-gora" data-firmy-przelacz="1" ' +
      'aria-expanded="' + (stan.firmyOtwarte ? "true" : "false") + '">' +
      '<span class="strzal">▶</span><span>Czas wg firm</span>' +
      '<span class="ile">' + liczba(suma.godz) + " h · " + lista.length + " " +
        odmiana(lista.length, "firma", "firmy", "firm") + "</span></button>";

  if(!stan.firmyOtwarte) return '<div class="firmy">' + gora + "</div>";

  var przelacznik = '<div class="firmy-zakres">' +
    '<button data-firmy-zakres="miesiac" aria-pressed="' + (zakres === "miesiac") + '">' +
      MIESIACE[stan.miesiac.m] + " " + stan.miesiac.r + "</button>" +
    '<button data-firmy-zakres="wszystko" aria-pressed="' + (zakres === "wszystko") + '">' +
      "Od początku</button></div>";

  var tresc = lista.length
    ? lista.map(function(f){
        return '<div class="firmy-wiersz"><span class="nazwa">' + esc(f.nazwa) + "</span>" +
          '<span class="drobne">' + f.ile + " " +
            odmiana(f.ile, "zlecenie", "zlecenia", "zleceń") +
            (f.km ? " · " + liczba(f.km) + " km" : "") + "</span>" +
          '<span class="godz">' + liczba(f.godz) + " h</span></div>";
      }).join("") +
      '<div class="firmy-suma"><span class="nazwa">Razem</span>' +
        '<span class="godz">' + liczba(suma.godz) + " h</span></div>"
    : '<div class="firmy-pusto">Brak zleceń w tym zakresie.</div>';

  return '<div class="firmy" data-otwarte="1">' + gora +
         '<div class="firmy-tresc">' + przelacznik + tresc + "</div></div>";
}

function widokKalendarz(){
  var m = stan.miesiac;
  var przesun = dowPon(new Date(m.r, m.m, 1));
  var dni = new Date(m.r, m.m + 1, 0).getDate();
  var dzis = dzisiaj();

  var licznik = {};
  wszystkie().forEach(function(z){
    (licznik[z.data] = licznik[z.data] || []).push(z.status);
  });

  var komorki = "";
  for(var i = 0; i < przesun; i++) komorki += '<div class="dzien obcy"></div>';
  for(var d = 1; d <= dni; d++){
    var k = m.r + "-" + pad(m.m + 1) + "-" + pad(d);
    var dow = dowPon(new Date(m.r, m.m, d));
    var kl = "dzien" + (dow > 4 ? " weekend" : "") +
             (k === dzis ? " dzis" : "") + (k === stan.wybrany ? " wybrany" : "");
    var kropki = (licznik[k] || []).slice(0, 3).map(function(s){
      return '<i class="i-' + s + '"></i>';
    }).join("");
    komorki += '<button class="' + kl + '" data-dzien="' + k + '"><span>' + d +
               '</span><span class="paski">' + kropki + "</span></button>";
  }

  var pod = podsumowanieMiesiaca(m);
  var pasekPod = pod.ile
    ? '<div class="podsumowanie"><span><b>' + pod.ile + "</b> " +
        odmiana(pod.ile, "zlecenie", "zlecenia", "zleceń") + "</span>" +
      (pod.godz ? "<span><b>" + liczba(pod.godz) + "</b> godzin</span>" : "") +
      (pod.km   ? "<span><b>" + liczba(pod.km)   + "</b> km</span>"     : "") +
      "</div>"
    : "";

  var wybrane = wDniu(stan.wybrany);
  var dolem = wybrane.length
    ? '<div class="lista">' + wybrane.map(wierszWpisu).join("") + "</div>"
    : '<div class="pusto"><p>Nic tu jeszcze nie ma. Naciśnij <b>+</b>, żeby zapisać, ' +
      "co robiłeś tego dnia i u kogo.</p></div>";

      '<button class="strzalka" data-miesiac="-1" aria-label="Poprzedni miesiąc">‹</button>' +

      '<button class="strzalka" data-miesiac="1" aria-label="Następny miesiąc">›</button></div>' +
    '<div class="siatka">' +
      DNI_SKROT.map(function(x){ return '<div class="dow">' + x + "</div>"; }).join("") +
      komorki + "</div>" + pasekPod + sekcjaFirm() +
    '<div class="naglowek-dnia"><h2>' + dataDluga(stan.wybrany) + "</h2><span>" +
      (wybrane.length ? wybrane.length + " " +
        odmiana(wybrane.length, "zlecenie", "zlecenia", "zleceń") : "") +
      "</span></div>" + dolem;

function widokLista(){
  var szukane = stan.szukaj.trim().toLowerCase();
  var lista = wszystkie().filter(function(z){
    if(stan.filtr === "otwarte"  && z.status === "zrobione") return false;
    if(stan.filtr === "zrobione" && z.status !== "zrobione") return false;
    if(stan.klientFiltr &&
       (z.klient || "").toLowerCase() !== stan.klientFiltr.toLowerCase()) return false;
    if(szukane){
      var stog = ((z.klient || "") + " " + (z.opis || "") + " " + (z.nastepnym || "")).toLowerCase();
      if(stog.indexOf(szukane) === -1) return false;
    }
    return true;
  }).sort(function(a,b){ return b.data.localeCompare(a.data); });

  var chipy = [["wszystkie","Wszystkie"],["otwarte","Do zrobienia"],["zrobione","Zrobione"]]
    .map(function(c){
      return '<button class="chip" data-filtr="' + c[0] + '" aria-pressed="' +
        (stan.filtr === c[0]) + '">' + c[1] + "</button>";
    }).join("");
  if(stan.klientFiltr){
    chipy += '<button class="chip" data-wyczysc-klienta="1" aria-pressed="true">' +
             esc(stan.klientFiltr) + " ✕</button>";
  }

  var tresc;
  if(!lista.length){
    tresc = '<div class="pusto"><div class="duze">Pusto</div><p>' +
      (wszystkie().length
        ? "Żadne zlecenie nie pasuje do tego, czego szukasz."
        : "Tu wyląduje wszystko, co zapiszesz — najnowsze na górze.") + "</p></div>";
  }else{
    var out = "", ostatnia = "";
    lista.forEach(function(z){
      if(z.data !== ostatnia){
        if(ostatnia) out += "</div>";
        out += '<div class="grupa-data">' + dataKrotka(z.data) + '</div><div class="lista">';
        ostatnia = z.data;
      }
      out += wierszWpisu(z);
    });
    tresc = out + "</div>";
  }

  return '<div class="filtry">' + chipy + "</div>" +
    '<input class="szukaj" id="pole-szukaj" type="search" ' +
      'placeholder="Szukaj klienta albo roboty…" value="' + esc(stan.szukaj) + '">' +
    sekcjaZaleglych() + tresc;
}

function widokTerminy(){
  var m = stan.miesiac;
  var przesun = dowPon(new Date(m.r, m.m, 1));
  var dni = new Date(m.r, m.m + 1, 0).getDate();
  var dzis = dzisiaj();

  var komorki = "";
  for(var i = 0; i < przesun; i++) komorki += '<div class="dzien obcy"></div>';
  for(var d = 1; d <= dni; d++){
    var k = m.r + "-" + pad(m.m + 1) + "-" + pad(d);
    var dow = dowPon(new Date(m.r, m.m, d));
    var tego = terminyWDniu(k);
    var kl = "dzien" + (dow > 4 ? " weekend" : "") +
             (k === dzis ? " dzis" : "") + (k === stan.wybrany ? " wybrany" : "");
    var kropki = tego.slice(0, 3).map(function(p){
      return '<i class="' + (p.powtarzanie ? "i-cykl" : "i-termin") + '"></i>';
    }).join("");
    komorki += '<button class="' + kl + '" data-dzien="' + k + '"><span>' + d +
               '</span><span class="paski">' + kropki + "</span></button>";
  }

  var naglowek = '<div class="miesiac">' +
    '<button class="strzalka" data-miesiac="-1" aria-label="Poprzedni miesiąc">‹</button>' +
    "<b>" + MIESIACE[m.m] + " " + m.r + "</b>" +
    '<button class="strzalka" data-miesiac="1" aria-label="Następny miesiąc">›</button></div>';

  var siatka = '<div class="siatka">' +
    DNI_SKROT.map(function(x){ return '<div class="dow">' + x + "</div>"; }).join("") +
    komorki + "</div>";

  // pod kalendarzem: wybrany dzień, a jak pusty — najbliższe terminy
  var wybrane = terminyWDniu(stan.wybrany);
  var dol;
  if(wybrane.length){
    dol = '<div class="grupa-data">' + dataDluga(stan.wybrany) + "</div>" +
          '<div class="lista">' + wybrane.map(function(p){
            return wierszTerminu(p, stan.wybrany);
          }).join("") + "</div>";
  }else{
    var kolejka = kolejkaTerminow();
    if(!kolejka.length){
      dol = '<div class="pusto"><div class="duze">Brak terminów</div>' +
        "<p>Tu wpisujesz swoje własne przypomnienia — ubezpieczenie, przegląd, " +
        "kopie configów. Mogą się powtarzać co tydzień, miesiąc albo rok, " +
        "a telefon zadzwoni sam.</p></div>";
    }else{
      var out = "", ostatnia = null;
      kolejka.forEach(function(x){
        var grupa = x.zalegly ? "Zaległe"
                  : x.kiedy === dzis ? "Dziś"
                  : x.kiedy === oDniPrzod(1) ? "Jutro"
                  : dataDluga(x.kiedy);
        if(grupa !== ostatnia){
          if(ostatnia) out += "</div>";
          out += '<div class="grupa-data' + (x.zalegly ? " pilna" : "") + '">' +
                 esc(grupa) + '</div><div class="lista">';
          ostatnia = grupa;
        }
        out += wierszTerminu(x.p, x.kiedy, x.zalegly);
      });
      dol = out + "</div>";
    }
  }

  return naglowek + siatka + dol;
}

function wierszTerminu(p, kiedy, zalegly){
  var meta = "";
  if(p.godzina) meta += '<span class="meta-tekst">' + esc(p.godzina) + "</span>";
  if(p.powtarzanie){
    meta += '<span class="znacznik cykl">↻ ' + esc(nazwaPowtarzania(p.powtarzanie)) + "</span>";
  }
  var przed = nazwaPrzed(p.przedMin);
  if(przed) meta += '<span class="znacznik dzwonek">🔔 ' + esc(przed) + "</span>";

  return '<button class="wpis' + (zalegly ? " pilny" : "") +
    '" data-termin="' + esc(p.id) + '">' +
    '<span class="pasek-statusu ' + (p.powtarzanie ? "s-cykl" : "s-termin") + '"></span>' +
    '<span class="wpis-tresc">' +
      '<span class="wpis-klient">' + esc(p.tytul || "(bez nazwy)") + "</span>" +
      '<span class="wpis-opis">' + esc(dataKrotka(kiedy)) + "</span>" +
      (p.notatka ? '<span class="wpis-opis">' + esc(p.notatka) + "</span>" : "") +
      '<span class="wpis-meta">' + meta + "</span></span></button>";
}
